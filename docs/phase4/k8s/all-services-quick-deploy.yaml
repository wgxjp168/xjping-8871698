        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: REDIS_PASSWORD
        # 代理IP池配置
        - name: PROXY_POOL_URL
          value: "http://proxy-pool-service.ilbuy-prod:5010/get"
