  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      imagePullSecrets:
      - name: harbor-secret
      terminationGracePeriodSeconds: 60
      containers:
      - name: order-service
        image: registry.ilbuy.com/ilbuy/order-service:1.0.0
        ports:
        - containerPort: 8085
          name: http
        - containerPort: 8095
