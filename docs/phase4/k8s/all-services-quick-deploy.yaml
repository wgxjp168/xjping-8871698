      labels:
        app: ai-matching-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8093"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      imagePullSecrets:
      - name: harbor-secret
      containers:
      - name: ai-matching-service
        image: registry.ilbuy.com/ilbuy/ai-matching-service:1.0.0
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 8093
          name: management
        envFrom:
        - configMapRef:
            name: ilbuy-common-config
        env:
        - name: DB_NAME
          value: "ilbuy_matching"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: REDIS_PASSWORD
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: ilbuy-llm-secrets
              key: LLM_API_KEY
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1g -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: management
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
