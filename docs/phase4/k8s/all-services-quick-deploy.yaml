  namespace: ilbuy-prod
  labels:
    app: order-service
    monitoring: "true"
spec:
  selector:
    app: order-service
  ports:
  - name: http
    port: 8085
    targetPort: 8085
  - name: management
    port: 8095
    targetPort: 8095
  type: ClusterIP

