            secretKeyRef:
              name: ilbuy-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: REDIS_PASSWORD
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: KAFKA_PASSWORD
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1g -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "2"
            memory: "1.5Gi"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: management
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 15"]
---
