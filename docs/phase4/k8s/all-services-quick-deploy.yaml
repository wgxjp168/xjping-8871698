---
# ============================================================
# 我来购ILbuy - 全量服务快速部署配置（Namespace + RBAC）
# 使用方式：kubectl apply -f all-services-quick-deploy.yaml
# ============================================================

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ilbuy-prod
  labels:
    name: ilbuy-prod
    environment: production

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ilbuy-service-account
  namespace: ilbuy-prod

---
# Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ilbuy-pod-reader
  namespace: ilbuy-prod
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ilbuy-pod-reader-binding
  namespace: ilbuy-prod
subjects:
- kind: ServiceAccount
  name: ilbuy-service-account
  namespace: ilbuy-prod
roleRef:
  kind: Role
  name: ilbuy-pod-reader
  apiGroup: rbac.authorization.k8s.io

---
# 公共ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: ilbuy-common-config
  namespace: ilbuy-prod
data:
  NACOS_SERVER_ADDR: "nacos-headless.middleware.svc.cluster.local:8848"
  NACOS_NAMESPACE: "prod"
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "192.168.1.31"
  DB_PORT: "3306"
  REDIS_NODES: "192.168.1.41:7001,192.168.1.41:7002,192.168.1.42:7003,192.168.1.42:7004,192.168.1.43:7005,192.168.1.43:7006"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.middleware.svc.cluster.local:9092"
  SEATA_SERVER_ADDR: "seata-server.middleware.svc.cluster.local:8091"

---
# Secrets（生产环境请使用外部Secret管理，如Vault/AWS Secrets Manager）
apiVersion: v1
kind: Secret
metadata:
  name: ilbuy-secrets
  namespace: ilbuy-prod
type: Opaque
stringData:
  DB_PASSWORD: "ILbuy@DB2024"
  REDIS_PASSWORD: "ILbuy@Redis2024"
  JWT_SECRET: "ILbuy@JWT@SecretKey@2024@Production@Base64Encoded"
  KAFKA_PASSWORD: "ILbuy@Kafka2024"

---
# ============================================================
# user-service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ilbuy-prod
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      imagePullSecrets:
      - name: harbor-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: user-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: user-service
        image: registry.ilbuy.com/ilbuy/user-service:1.0.0
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 8091
          name: management
        envFrom:
        - configMapRef:
            name: ilbuy-common-config
        env:
        - name: DB_NAME
          value: "ilbuy_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ilbuy-secrets
              key: JWT_SECRET
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
        resources:
          requests:
            cpu: "250m"
            memory: "384Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: management
          failureThreshold: 25
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ilbuy-prod
  labels:
    app: user-service
    monitoring: "true"
spec:
  selector:
    app: user-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  - name: management
    port: 8091
    targetPort: 8091
  type: ClusterIP

---
# ============================================================
# ai-matching-service
