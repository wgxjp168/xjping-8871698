# ============================================================
# ILbuy 网关服务配置 — 生产环境
# Nacos Data ID : gateway-svc.yaml
# Namespace     : ilbuy-prod
# ============================================================

server:
  port: 8080

spring:
  application:
    name: gateway-svc

  cloud:
    gateway:
      # 全局 CORS（生产收紧 allow-origins）
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "https://ilbuy.com"
              - "https://admin.ilbuy.com"
              - "https://supplier.ilbuy.com"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 86400

      routes:
        - id: user-svc
          uri: lb://user-svc
          predicates: [Path=/api/user/**]
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate:  100
                redis-rate-limiter.burstCapacity:  200
                key-resolver: "#{@ipKeyResolver}"

        - id: product-svc
          uri: lb://product-svc
          predicates: [Path=/api/product/**]
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate:  200
                redis-rate-limiter.burstCapacity:  400
                key-resolver: "#{@ipKeyResolver}"

        - id: order-svc
          uri: lb://order-svc
          predicates: [Path=/api/order/**]
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate:  50
                redis-rate-limiter.burstCapacity:  100
                key-resolver: "#{@userKeyResolver}"

        - id: supplier-svc
          uri: lb://supplier-svc
          predicates: [Path=/api/supplier/**]
          filters: [StripPrefix=1]

        - id: finance-svc
          uri: lb://finance-svc
          predicates: [Path=/api/finance/**]
          filters: [StripPrefix=1]

        - id: message-svc
          uri: lb://message-svc
          predicates: [Path=/api/message/**]
          filters: [StripPrefix=1]

        - id: biz-data-svc
          uri: lb://biz-data-svc
          predicates: [Path=/api/data/**]
          filters: [StripPrefix=1]

        - id: ai-svc
          uri: lb://ai-svc
          predicates: [Path=/api/ai/**]
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate:  10
                redis-rate-limiter.burstCapacity:  20
                key-resolver: "#{@userKeyResolver}"

ilbuy:
  gateway:
    jwt-secret: ${JWT_SECRET}
    # 白名单（无需鉴权）
    whitelist:
      - /api/user/login
      - /api/user/register
      - /api/user/sms-code
      - /api/user/oauth2/**
      - /api/product/list
      - /api/product/detail/**
      - /actuator/health
