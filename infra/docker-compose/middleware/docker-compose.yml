###############################################################
# ILbuy 中间件 Docker Compose
# 用途：本地开发一键启动所有中间件
# 用法：
#   cp .env .env.local && vim .env.local   # 修改密码等
#   docker compose --env-file .env.local up -d
#   docker compose --env-file .env.local down
###############################################################

version: "3.9"

# ── 网络 ─────────────────────────────────────────────────────
networks:
  ilbuy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

# ── 数据卷 ────────────────────────────────────────────────────
volumes:
  mysql-data:
  redis-data:
  es-data:
  rabbitmq-data:
  nacos-data:
  minio-data:
  clickhouse-data:

###############################################################
services:

  # ──────────────────────────────────────────────────────────
  #  MySQL 8.0（单节点，含多库初始化）
  # ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0.36}
    container_name: ilbuy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ilbuy123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro   # 自动执行初始化 SQL
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/ilbuy.cnf:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
      --binlog-format=ROW
      --log-bin=mysql-bin
      --server-id=1
      --max-connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-ilbuy123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.10

  # ──────────────────────────────────────────────────────────
  #  Redis 7.2（单节点，含持久化）
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: ilbuy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-ilbuy123}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ilbuy123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.11

  # ──────────────────────────────────────────────────────────
  #  Elasticsearch 8.11（单节点，禁用安全简化本地开发）
  # ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.11.4}
    container_name: ilbuy-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      - xpack.security.enabled=false          # 本地开发关闭安全
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-ilbuy123}
      - TZ=Asia/Shanghai
    ports:
      - "${ES_PORT:-9200}:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./config/es/ilbuy-ik-plugin.txt:/tmp/ik-plugin-list.txt:ro
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.12

  # ──────────────────────────────────────────────────────────
  #  Kibana 8.11（ES 可视化）
  # ──────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ES_VERSION:-8.11.4}
    container_name: ilbuy-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - i18n.locale=zh-CN
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.13

  # ──────────────────────────────────────────────────────────
  #  RabbitMQ 3.12（含管理界面）
  # ──────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3.12-management}
    container_name: ilbuy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.14

  # ──────────────────────────────────────────────────────────
  #  Nacos 2.3（单节点，内置 Derby DB）
  # ──────────────────────────────────────────────────────────
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION:-v2.3.2}
    container_name: ilbuy-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD:-ilbuy123}
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-false}
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - JVM_XMS=256m
      - JVM_XMX=512m
      - TZ=Asia/Shanghai
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.15

  # ──────────────────────────────────────────────────────────
  #  MinIO（对象存储）
  # ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-01-16T16-07-38Z}
    container_name: ilbuy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.16

  # ── MinIO 初始化：创建 Bucket ──────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: ilbuy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/ilbuy-reports;
        mc mb --ignore-existing local/ilbuy-images;
        mc mb --ignore-existing local/ilbuy-contracts;
        mc anonymous set download local/ilbuy-images;
        echo 'MinIO buckets initialized';
      "
    networks:
      - ilbuy-net

  # ──────────────────────────────────────────────────────────
  #  ClickHouse（OLAP 分析库）
  # ──────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-23.12}
    container_name: ilbuy-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      TZ: Asia/Shanghai
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/ilbuy.xml:ro
      - ./init-sql/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.17

  # ──────────────────────────────────────────────────────────
  #  Canal Server（MySQL Binlog 监听）
  # ──────────────────────────────────────────────────────────
  canal:
    image: canal/canal-server:${CANAL_VERSION:-v1.1.7}
    container_name: ilbuy-canal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - canal.instance.mysql.slaveId=1234
      - canal.instance.master.address=mysql:3306
      - canal.instance.dbUsername=root
      - canal.instance.dbPassword=${MYSQL_ROOT_PASSWORD:-ilbuy123}
      - canal.instance.filter.regex=product_db\\..*,order_db\\..*,user_db\\..*
      - canal.destinations=ilbuy
    ports:
      - "${CANAL_PORT:-11111}:11111"
    networks:
      ilbuy-net:
        ipv4_address: 172.30.0.18
