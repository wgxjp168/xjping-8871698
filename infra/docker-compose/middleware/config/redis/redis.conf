# ============================================================
# ILbuy Redis 7.2 配置
# 路径：/usr/local/etc/redis/redis.conf（Docker 挂载）
# 注：密码通过 docker-compose command 参数 --requirepass 传入
# ============================================================

# ── 网络 ─────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── 持久化（AOF 为主，RDB 为辅）────────────────────────
# AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# RDB（兜底快照）
save 3600 1
save 300 100
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── 内存管理 ─────────────────────────────────────────────
# maxmemory 和 maxmemory-policy 通过 docker-compose command 传入
# 此处设置其他内存相关参数
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ── 慢日志 ───────────────────────────────────────────────
slowlog-log-slower-than 10000    # 10ms
slowlog-max-len 128

# ── 客户端 ───────────────────────────────────────────────
maxclients 10000
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ── 日志 ─────────────────────────────────────────────────
loglevel notice
logfile ""

# ── LUA 脚本超时 ─────────────────────────────────────────
lua-time-limit 5000

# ── 其他 ─────────────────────────────────────────────────
databases 16
hz 10
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
activerehashing yes
latency-monitor-threshold 0
notify-keyspace-events ""
