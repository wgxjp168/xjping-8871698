server:
  port: 8888

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: physical-gateway
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASS:}
    database: 0
    timeout: 3000ms
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # 权限服务路由（login/validate 无 AuthFilter，由白名单放行）
        - id: physical-auth
          uri: http://${AUTH_SERVICE_HOST:localhost}:9005
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        # DR服务路由
        - id: physical-dr
          uri: http://${DR_SERVICE_HOST:localhost}:9011
          predicates:
            - Path=/api/dr/**
          filters:
            - StripPrefix=1
            - AuthFilter

        # 核心业务服务路由
        - id: physical-core
          uri: http://${CORE_SERVICE_HOST:localhost}:9001
          predicates:
            - Path=/api/core/**
          filters:
            - StripPrefix=1
            - AuthFilter

        # 同步服务路由
        - id: physical-sync
          uri: http://${SYNC_SERVICE_HOST:localhost}:9004
          predicates:
            - Path=/api/sync/**
          filters:
            - StripPrefix=1
            - AuthFilter

        # 尿机服务路由
        - id: physical-urine
          uri: http://${URINE_SERVICE_HOST:localhost}:9010
          predicates:
            - Path=/api/urine/**
          filters:
            - StripPrefix=1
            - AuthFilter

        # 网页端静态资源（Vue3前端）
        - id: physical-web
          uri: http://${WEB_SERVICE_HOST:localhost}:80
          predicates:
            - Path=/web/**
          filters:
            - StripPrefix=1

# Gateway 配置属性（GatewayProperties 绑定）
gateway:
  jwt-secret: ${JWT_SECRET:physical_health_system_jwt_secret_key_2024_secure_enough}
  white-list:
    - /api/auth/login
    - /api/auth/validate
    - /api/dr/register        # 县域回调注册DR开单，无需鉴权
    - /actuator/health/liveness
    - /actuator/health/readiness

logging:
  level:
    org.springframework.cloud.gateway: info
    com.health.physical: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
