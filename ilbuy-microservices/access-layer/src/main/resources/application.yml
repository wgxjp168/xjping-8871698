server:
  port: 8080

spring:
  application:
    name: ilbuy-access-layer
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

ilbuy:
  routes:
    business-logic: ${BUSINESS_LOGIC_URL:http://business-logic:8082}
    ai-decision-hub: ${AI_DECISION_HUB_URL:http://ai-decision-hub:8081}
    data-layer: ${DATA_LAYER_URL:http://data-layer:8083}
    support-ops: ${SUPPORT_OPS_URL:http://support-ops:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.ilbuy: DEBUG
    org.springframework.cloud.gateway: INFO
