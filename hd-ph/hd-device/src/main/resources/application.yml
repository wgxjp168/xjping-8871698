server:
  port: 8003

spring:
  application:
    name: hd-device
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hd_public_health?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: root123
  redis:
    host: localhost
    port: 6379
    database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.hd.device.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== 设备通信配置 =====
device:
  # TCP服务端 7100端口，等待所有TCP设备主动连接
  tcp:
    port: 7100
    enabled: true
  # 串口设备监听（优利特/理邦/雷诺华）
  serial:
    enabled: true
  # 文件监控（迈瑞BS330/万瑞BS830 LIS文件输出）
  file:
    enabled: true
    charset: GBK

# ===== 惠东县公卫平台上传配置 =====
# 配置正式接口地址和密钥后将enabled改为true启用自动上传
pubhealth:
  upload:
    enabled: false
    url: ""                       # 公卫系统上传接口（由卫生局提供）
    api-key: ""                   # 接入密钥（由卫生局分配）
    hospital-code: "HD_DEFAULT"   # 本机构在公卫系统的编码

knife4j:
  enable: true
  openapi:
    title: 设备集成服务接口文档
    version: 1.0.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.hd.device.controller

logging:
  level:
    com.hd.device: debug
