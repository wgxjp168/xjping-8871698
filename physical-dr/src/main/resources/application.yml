server:
  port: 9011
  servlet:
    context-path: /

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: physical-dr
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:physical_health}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:physical@2024}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASS:}
    database: 0
    timeout: 3000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.health.physical.dr.entity,com.health.physical.common.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT配置（与auth服务使用相同密钥）
jwt:
  secret: ${JWT_SECRET:physical_health_system_jwt_secret_key_2024_secure_enough}

# 权限服务地址
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:9005}

# 县域公卫同步
county:
  api:
    base-url: ${COUNTY_API_URL:http://county-gateway:8080}
    token: ${COUNTY_API_TOKEN:}

# DR条码前缀（用于快速识别DR条码）
dr:
  barcode:
    prefix: "DR"
    length: 18

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.health.physical: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
