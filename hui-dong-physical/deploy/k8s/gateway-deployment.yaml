apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: physical
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: registry.huidong/physical/gateway:1.0.0
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: physical-config
            - secretRef:
                name: physical-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: physical
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30888
