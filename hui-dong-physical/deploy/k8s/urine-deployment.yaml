apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-urine
  namespace: physical
  labels:
    app: physical-urine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: physical-urine
  template:
    metadata:
      labels:
        app: physical-urine
    spec:
      containers:
        - name: physical-urine
          image: registry.huidong/physical/physical-urine:1.0.0
          ports:
            - containerPort: 9010
          envFrom:
            - configMapRef:
                name: physical-config
            - secretRef:
                name: physical-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9010
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9010
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: physical-urine
  namespace: physical
spec:
  selector:
    app: physical-urine
  ports:
    - port: 9010
      targetPort: 9010
