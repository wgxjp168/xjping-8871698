apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-core
  namespace: physical
  labels:
    app: physical-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: physical-core
  template:
    metadata:
      labels:
        app: physical-core
    spec:
      containers:
        - name: physical-core
          image: registry.huidong/physical/physical-core:1.0.0
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: physical-config
            - secretRef:
                name: physical-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9001
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: physical-core
  namespace: physical
spec:
  selector:
    app: physical-core
  ports:
    - port: 9001
      targetPort: 9001
