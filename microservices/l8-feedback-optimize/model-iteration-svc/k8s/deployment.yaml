---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-iteration-svc-config
  namespace: ilbuy-l8
data:
  CLICKHOUSE_HOST: "clickhouse.ilbuy-infra.svc.cluster.local"
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DB: "ilbuy_analytics"
  CLICKHOUSE_USER: "default"
  MODEL_STORE_PATH: "/app/model_store"
  MIN_TRAINING_SAMPLES: "100"
  MIN_AUC: "0.65"
  MIN_F1: "0.60"
  AB_TEST_MIN_SAMPLE_SIZE: "200"
  AB_TEST_CONFIDENCE_LEVEL: "0.95"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-iteration-svc
  namespace: ilbuy-l8
  labels:
    app: model-iteration-svc
    layer: l8-feedback-optimize
spec:
  # replicas=1: behavior consumer uses an in-memory sample buffer; multiple
  # replicas would split the buffer across pods preventing the training
  # threshold from being reached. Scale the API layer via HPA once the buffer
  # is migrated to a persistent store (Redis / DB).
  replicas: 1
  selector:
    matchLabels:
      app: model-iteration-svc
  template:
    metadata:
      labels:
        app: model-iteration-svc
        layer: l8-feedback-optimize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8062"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: model-iteration-svc
          image: ilbuy/model-iteration-svc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8062
              name: http
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l8-db-secret
                  key: db_url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l8-rabbitmq-secret
                  key: rabbitmq_url
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l8-clickhouse-secret
                  key: clickhouse_password
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: CLICKHOUSE_HOST
            - name: CLICKHOUSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: CLICKHOUSE_PORT
            - name: CLICKHOUSE_DB
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: CLICKHOUSE_USER
            - name: MODEL_STORE_PATH
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: MODEL_STORE_PATH
            - name: MIN_TRAINING_SAMPLES
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: MIN_TRAINING_SAMPLES
            - name: MIN_AUC
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: MIN_AUC
            - name: MIN_F1
              valueFrom:
                configMapKeyRef:
                  name: model-iteration-svc-config
                  key: MIN_F1
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8062
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8062
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: model-store
              mountPath: /app/model_store
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: ilbuy-model-store-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: model-iteration-svc
  namespace: ilbuy-l8
  labels:
    app: model-iteration-svc
spec:
  selector:
    app: model-iteration-svc
  ports:
    - name: http
      port: 8062
      targetPort: 8062
      protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-iteration-svc-hpa
  namespace: ilbuy-l8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-iteration-svc
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
