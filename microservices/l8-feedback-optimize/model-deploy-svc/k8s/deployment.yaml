---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-deploy-svc
  namespace: ilbuy-l8
  labels:
    app: model-deploy-svc
    layer: l8-feedback-optimize
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-deploy-svc
  template:
    metadata:
      labels:
        app: model-deploy-svc
        layer: l8-feedback-optimize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8063"
    spec:
      serviceAccountName: ilbuy-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: model-deploy-svc
          image: ilbuy/model-deploy-svc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8063
              protocol: TCP
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l8-db-secret
                  key: url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-rabbitmq-secret
                  key: url
            - name: DECISION_SVC_URL
              value: "http://decision-svc:8012"
            - name: MODEL_STORE_PATH
              value: "/app/model_store"
            - name: MAX_ACTIVE_DEPLOYMENTS
              value: "2"
          volumeMounts:
            - name: model-store
              mountPath: /app/model_store
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8063
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8063
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: ilbuy-model-store-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: model-deploy-svc
  namespace: ilbuy-l8
spec:
  type: ClusterIP
  selector:
    app: model-deploy-svc
  ports:
    - port: 8063
      targetPort: 8063
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-deploy-svc-hpa
  namespace: ilbuy-l8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-deploy-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
