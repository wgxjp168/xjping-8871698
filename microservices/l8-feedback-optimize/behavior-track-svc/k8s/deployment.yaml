---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: behavior-track-svc
  namespace: ilbuy-l8
  labels:
    app: behavior-track-svc
    layer: l8-feedback-optimize
spec:
  replicas: 2
  selector:
    matchLabels:
      app: behavior-track-svc
  template:
    metadata:
      labels:
        app: behavior-track-svc
        layer: l8-feedback-optimize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8061"
    spec:
      serviceAccountName: ilbuy-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: behavior-track-svc
          image: ilbuy/behavior-track-svc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8061
              protocol: TCP
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l8-db-secret
                  key: url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-rabbitmq-secret
                  key: url
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l8-config
                  key: clickhouse.host
            - name: CLICKHOUSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l8-config
                  key: clickhouse.port
            - name: CLICKHOUSE_DB
              value: "ilbuy_analytics"
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: ilbuy-clickhouse-secret
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-clickhouse-secret
                  key: password
            - name: AGGREGATION_INTERVAL_MINUTES
              value: "60"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8061
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8061
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: behavior-track-svc
  namespace: ilbuy-l8
spec:
  type: ClusterIP
  selector:
    app: behavior-track-svc
  ports:
    - port: 8061
      targetPort: 8061
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: behavior-track-svc-hpa
  namespace: ilbuy-l8
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: behavior-track-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
