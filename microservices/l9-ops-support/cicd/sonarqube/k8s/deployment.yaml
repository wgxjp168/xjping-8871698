---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: ilbuy-ops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ilbuy-ssd
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: ilbuy-ops
  labels:
    app: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=524288", "fs.file-max=131072"]
          securityContext:
            privileged: true
      containers:
        - name: sonarqube
          image: sonarqube:10.5-community
          env:
            - name: SONAR_JDBC_URL
              value: "jdbc:postgresql://postgres.ilbuy-infra.svc.cluster.local:5432/sonarqube"
            - name: SONAR_JDBC_USERNAME
              value: "sonar"
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-secrets
                  key: db-password
            - name: SONAR_WEB_CONTEXT
              value: ""
            - name: SONAR_WEB_PORT
              value: "9000"
            - name: SONAR_CE_JAVAOPTS
              value: "-Xmx1g"
            - name: SONAR_WEB_JAVAOPTS
              value: "-Xmx512m"
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
            - name: extensions
              mountPath: /opt/sonarqube/extensions
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sonarqube-data
        - name: extensions
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: ilbuy-ops
  labels:
    app: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
    - name: http
      port: 9000
      targetPort: 9000
  type: ClusterIP
