# SonarQube 项目质量门配置模板
# 适用于 ILbuy 所有微服务（Python FastAPI / Java Spring Boot）
# 在各微服务目录下创建同名文件并填写 SERVICE_NAME

# ── 项目标识 ─────────────────────────────────────────────────────────────────
sonar.projectKey=ilbuy-SERVICE_NAME
sonar.projectName=ILbuy SERVICE_NAME
sonar.projectVersion=1.0

# ── 源码目录（Python 服务）────────────────────────────────────────────────────
sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**,**/alembic/**

# ── 语言配置 ─────────────────────────────────────────────────────────────────
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPaths=test-results.xml

# Java 服务配置（取消注释）
# sonar.java.source=21
# sonar.java.binaries=target/classes
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── 质量门阈值（所有微服务统一标准）─────────────────────────────────────────
# 覆盖率 ≥ 70%
# 重复代码 ≤ 5%
# 可靠性评级 ≥ A
# 安全性评级 ≥ A
# 可维护性评级 ≥ A
# 新代码覆盖率 ≥ 80%

# ── SonarQube 服务器 ──────────────────────────────────────────────────────────
# 通过环境变量或 CI 系统传入，不在此文件写死：
# sonar.host.url=http://sonarqube.ilbuy-ops.svc.cluster.local:9000
# sonar.token=${SONAR_TOKEN}

# ── 链接配置 ─────────────────────────────────────────────────────────────────
sonar.links.scm=https://gitlab.ilbuy.internal/ilbuy/SERVICE_NAME
sonar.links.ci=https://jenkins.ilbuy.internal/job/SERVICE_NAME

# ── 代码行为分析 ──────────────────────────────────────────────────────────────
sonar.scm.provider=git
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
