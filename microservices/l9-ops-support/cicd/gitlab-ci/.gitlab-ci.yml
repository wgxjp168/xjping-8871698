# ILbuy GitLab CI/CD Pipeline
# 适用于 GitLab 16+ / GitLab Runner with Kubernetes executor
# 在项目根目录 .gitlab-ci.yml 使用，或通过 include 引用

variables:
  HARBOR_REGISTRY: "harbor.ilbuy.internal"
  IMAGE_NAME: "${HARBOR_REGISTRY}/ilbuy/${SERVICE_NAME}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  FULL_IMAGE: "${IMAGE_NAME}:${IMAGE_TAG}"
  SONAR_PROJECT_KEY: "ilbuy-${SERVICE_NAME}"
  # 需在 GitLab Group/Project 变量中配置：
  # HARBOR_USER, HARBOR_PASSWORD, SONAR_TOKEN, KUBECONFIG_DEV, KUBECONFIG_PROD

# ─── 流水线阶段 ────────────────────────────────────────────────────────────
stages:
  - lint
  - test
  - sonar
  - build
  - scan
  - deploy-dev
  - deploy-staging
  - deploy-prod

# ─── 公共 Docker In Docker 配置 ────────────────────────────────────────────
.docker_config: &docker_config
  image: docker:25-dind
  services:
    - name: docker:25-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker login ${HARBOR_REGISTRY} -u "${HARBOR_USER}" -p "${HARBOR_PASSWORD}"

# ─── Python 服务基础配置 ───────────────────────────────────────────────────
.python_base: &python_base
  image: python:3.11-slim
  before_script:
    - cd microservices/${SERVICE_LAYER}/${SERVICE_NAME}
    - pip install --no-cache-dir -r requirements.txt

# ─── Stage: lint ──────────────────────────────────────────────────────────
lint:python:
  stage: lint
  <<: *python_base
  script:
    - pip install --no-cache-dir ruff mypy
    - ruff check app/ tests/ --select=E,W,F,B --ignore=E501
    - mypy app/ --ignore-missing-imports --no-strict-optional
  allow_failure: true  # lint 错误不阻断流水线，但有报告
  rules:
    - if: $SERVICE_LANG == "python"

# ─── Stage: test ──────────────────────────────────────────────────────────
test:unit:
  stage: test
  <<: *python_base
  script:
    - python -m pytest tests/ -v
        --tb=short
        --junit-xml=test-results.xml
        --cov=app
        --cov-report=xml:coverage.xml
        --cov-report=term-missing
        --cov-fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: "microservices/${SERVICE_LAYER}/${SERVICE_NAME}/test-results.xml"
      coverage_report:
        coverage_format: cobertura
        path: "microservices/${SERVICE_LAYER}/${SERVICE_NAME}/coverage.xml"
    expire_in: 7 days
  rules:
    - if: $SERVICE_LANG == "python"

# ─── Stage: sonar ─────────────────────────────────────────────────────────
sonar:scan:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: 0  # SonarQube 需要完整 git 历史
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - |
      cd microservices/${SERVICE_LAYER}/${SERVICE_NAME}
      sonar-scanner \
        -Dsonar.host.url="${SONAR_HOST_URL:-http://sonarqube.ilbuy-ops.svc.cluster.local:9000}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
        -Dsonar.projectName="ILbuy ${SERVICE_NAME}" \
        -Dsonar.projectVersion="${CI_COMMIT_SHORT_SHA}" \
        -Dsonar.sources=app \
        -Dsonar.tests=tests \
        -Dsonar.python.coverage.reportPaths=coverage.xml \
        -Dsonar.python.version=3.11 \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.qualitygate.timeout=300 \
        -Dsonar.scm.revision="${CI_COMMIT_SHA}" \
        -Dsonar.links.ci="${CI_PIPELINE_URL}"
  needs: [test:unit]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|release\/.+)$/
    - if: $CI_MERGE_REQUEST_IID

# ─── Stage: build ─────────────────────────────────────────────────────────
build:docker:
  stage: build
  <<: *docker_config
  script:
    - |
      cd microservices/${SERVICE_LAYER}/${SERVICE_NAME}
      DOCKER_BUILDKIT=1 docker build \
        --cache-from ${IMAGE_NAME}:latest \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --label "git.commit=${CI_COMMIT_SHORT_SHA}" \
        --label "build.id=${CI_JOB_ID}" \
        --label "build.url=${CI_JOB_URL}" \
        -t ${FULL_IMAGE} \
        -t ${IMAGE_NAME}:latest \
        .
      docker push ${FULL_IMAGE}
      docker push ${IMAGE_NAME}:latest
  needs: [sonar:scan]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|release\/.+)$/

# ─── Stage: scan (Trivy 镜像安全) ─────────────────────────────────────────
scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.51.4
    entrypoint: [""]
  script:
    - |
      trivy image \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --format sarif \
        --output trivy-results.sarif \
        ${FULL_IMAGE}
      # CRITICAL 漏洞告警（不阻断，除非有修复方案）
      trivy image \
        --exit-code 0 \
        --severity CRITICAL \
        --ignore-unfixed \
        ${FULL_IMAGE}
  artifacts:
    reports:
      sast: trivy-results.sarif
    expire_in: 7 days
  needs: [build:docker]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|release\/.+)$/

# ─── Stage: deploy-dev ────────────────────────────────────────────────────
deploy:dev:
  stage: deploy-dev
  image: bitnami/kubectl:1.29
  environment:
    name: development
    url: https://${SERVICE_NAME}.dev.ilbuy.internal
  script:
    - echo "${KUBECONFIG_DEV}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - |
      kubectl set image deployment/${SERVICE_NAME} \
        ${SERVICE_NAME}=${FULL_IMAGE} \
        -n ilbuy-dev
      kubectl rollout status deployment/${SERVICE_NAME} \
        -n ilbuy-dev \
        --timeout=10m
  needs: [scan:trivy]
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ─── Stage: deploy-staging ────────────────────────────────────────────────
deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:1.29
  environment:
    name: staging
    url: https://${SERVICE_NAME}.staging.ilbuy.internal
  script:
    - echo "${KUBECONFIG_STAGING}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - |
      kubectl set image deployment/${SERVICE_NAME} \
        ${SERVICE_NAME}=${FULL_IMAGE} \
        -n ilbuy-staging
      kubectl rollout status deployment/${SERVICE_NAME} \
        -n ilbuy-staging \
        --timeout=10m
  needs: [scan:trivy]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.+$/

# ─── Stage: deploy-prod ───────────────────────────────────────────────────
deploy:prod:
  stage: deploy-prod
  image: bitnami/kubectl:1.29
  environment:
    name: production
    url: https://${SERVICE_NAME}.ilbuy.internal
  when: manual  # 生产部署必须人工触发
  script:
    - echo "${KUBECONFIG_PROD}" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - |
      kubectl set image deployment/${SERVICE_NAME} \
        ${SERVICE_NAME}=${FULL_IMAGE} \
        -n ilbuy-${SERVICE_LAYER%%-*}
      kubectl rollout status deployment/${SERVICE_NAME} \
        -n ilbuy-${SERVICE_LAYER%%-*} \
        --timeout=15m
      # 验证健康状态
      sleep 15
      READY=$(kubectl get deployment ${SERVICE_NAME} \
        -n ilbuy-${SERVICE_LAYER%%-*} \
        -o jsonpath='{.status.readyReplicas}')
      DESIRED=$(kubectl get deployment ${SERVICE_NAME} \
        -n ilbuy-${SERVICE_LAYER%%-*} \
        -o jsonpath='{.spec.replicas}')
      echo "就绪: ${READY} / ${DESIRED}"
      [ "${READY}" = "${DESIRED}" ] || exit 1
  needs: [deploy:staging]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
