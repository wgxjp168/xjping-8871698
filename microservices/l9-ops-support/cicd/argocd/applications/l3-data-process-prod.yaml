# L3 数据采集层 — crawler-svc & etl-svc 生产 Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crawler-svc-prod
  namespace: argocd
  labels:
    layer: l3
    service: crawler-svc
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.dingtalk: data-team
    notifications.argoproj.io/subscribe.on-deployed.dingtalk: data-team
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l3-data-process/crawler-svc/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/crawler-svc:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l3
  syncPolicy:
    automated: null   # 生产手动同步
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10

---
