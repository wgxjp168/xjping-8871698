# L2 AI决策层 — decision-svc 生产 & 开发 Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: decision-svc-prod
  namespace: argocd
  labels:
    layer: l2
    service: decision-svc
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.dingtalk: ai-team
    notifications.argoproj.io/subscribe.on-deployed.dingtalk: ai-team
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l2-ai-decision/decision-svc/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/decision-svc:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l2
  syncPolicy:
    automated: null   # 生产手动同步
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-serving-svc-prod
  namespace: argocd
  labels:
    layer: l2
    service: model-serving-svc
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l2-ai-decision/model-serving-svc/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/model-serving-svc:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l2
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
