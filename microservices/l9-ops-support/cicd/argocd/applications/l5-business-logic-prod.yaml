# L5 业务逻辑层 — 核心微服务 生产 Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-svc-prod
  namespace: argocd
  labels:
    layer: l5
    service: gateway-svc
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.dingtalk: backend-team
    notifications.argoproj.io/subscribe.on-deployed.dingtalk: backend-team
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l5-business-logic/gateway-svc/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/gateway-svc:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l5
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10

