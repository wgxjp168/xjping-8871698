# L7 变现层 — 生产 Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monetize-gateway-svc-prod
  namespace: argocd
  labels:
    layer: l7
    service: monetize-gateway-svc
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.dingtalk: monetize-team
    notifications.argoproj.io/subscribe.on-deployed.dingtalk: monetize-team
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l7-monetization/monetize-gateway-svc/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/monetize-gateway-svc:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l7
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10

