# L4 数据存储层 — data-svc & flink-job 生产 Application
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-svc-prod
  namespace: argocd
  labels:
    layer: l4
    service: data-svc
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.dingtalk: data-team
    notifications.argoproj.io/subscribe.on-deployed.dingtalk: data-team
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l4-data-storage/data-svc/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/data-svc:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l4
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-job-prod
  namespace: argocd
  labels:
    layer: l4
    service: flink-job
    env: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.dingtalk: data-team
    notifications.argoproj.io/subscribe.on-health-degraded.dingtalk: oncall-critical
spec:
  project: ilbuy
  source:
    repoURL: https://gitlab.ilbuy.internal/ilbuy/ilbuy-platform
    targetRevision: HEAD
    path: microservices/l4-data-storage/flink-job/k8s
    kustomize:
      images:
        - harbor.ilbuy.internal/ilbuy/flink-job:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: ilbuy-l4
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 10
