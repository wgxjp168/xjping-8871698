---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: ilbuy-ops
data:
  vault.hcl: |
    ui            = true
    disable_mlock = true

    storage "postgresql" {
      connection_url = "postgresql://vault:${VAULT_DB_PASSWORD}@postgres.ilbuy-infra.svc.cluster.local:5432/vault?sslmode=disable"
      ha_enabled     = "true"
      ha_table       = "vault_ha_locks"
    }

    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_disable   = "true"  # 生产: 配置 tls_cert_file/tls_key_file
    }

    # Auto Unseal — 使用外部 KMS（生产环境）
    # seal "awskms" {
    #   region     = "ap-east-1"
    #   kms_key_id = "alias/ilbuy-vault-unseal"
    # }

    api_addr     = "http://vault.ilbuy-ops.svc.cluster.local:8200"
    cluster_addr = "http://${POD_IP}:8201"

    log_level    = "info"
    log_format   = "json"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: ilbuy-ops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ilbuy-ssd
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: ilbuy-ops
  labels:
    app: vault
spec:
  replicas: 3
  serviceName: vault
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/v1/sys/metrics"
        prometheus.io/port: "8200"
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 1000
      containers:
        - name: vault
          image: hashicorp/vault:1.16.2
          args: ["server", "-config=/vault/config/vault.hcl"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VAULT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: db-password
            - name: VAULT_LOG_LEVEL
              value: info
            - name: VAULT_API_ADDR
              value: "http://$(POD_IP):8200"
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 8201
              name: cluster
          securityContext:
            capabilities:
              add: [IPC_LOCK]  # Vault 内存锁定
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&perfstandbyok=true
              port: 8200
            initialDelaySeconds: 60
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: data
          persistentVolumeClaim:
            claimName: vault-data

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: ilbuy-ops
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
    - name: cluster
      port: 8201
      targetPort: 8201
  publishNotReadyAddresses: true  # HA 集群需要
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: vault-active
  namespace: ilbuy-ops
spec:
  selector:
    app: vault
    vault-active: "true"
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: ilbuy-ops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: ilbuy-ops
