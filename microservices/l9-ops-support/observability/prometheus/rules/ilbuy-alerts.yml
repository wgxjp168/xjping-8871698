groups:

  # ============================================================
  # 服务可用性告警
  # ============================================================
  - name: ilbuy.service.availability
    rules:

      - alert: ServiceDown
        expr: up{job=~"l[1-8]-.+"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "服务下线: {{ $labels.service }} ({{ $labels.namespace }})"
          description: "{{ $labels.pod }} 已离线超过 1 分钟。请立即检查 Pod 状态。"
          runbook: "https://wiki.ilbuy.internal/ops/runbooks/service-down"

      - alert: HighPodRestartRate
        expr: increase(kube_pod_container_status_restarts_total{namespace=~"ilbuy-.+"}[30m]) > 3
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Pod 频繁重启: {{ $labels.pod }}"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} 30分钟内重启超过3次。"

      - alert: PodCrashLooping
        expr: |
          kube_pod_container_status_waiting_reason{
            namespace=~"ilbuy-.+",
            reason="CrashLoopBackOff"
          } == 1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod CrashLoopBackOff: {{ $labels.pod }}"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} 处于 CrashLoopBackOff 状态。"

  # ============================================================
  # HTTP 错误率告警
  # ============================================================
  - name: ilbuy.http.errors
    rules:

      - alert: HighHTTP5xxRate
        expr: |
          sum(rate(http_requests_total{
            job=~"l[1-8]-.+",
            status=~"5.."
          }[5m])) by (service, namespace)
          /
          sum(rate(http_requests_total{job=~"l[1-8]-.+"}[5m])) by (service, namespace)
          > 0.05
        for: 3m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "高5xx错误率: {{ $labels.service }}"
          description: "{{ $labels.service }} 5xx 错误率超过 5%（当前: {{ $value | humanizePercentage }}）。"

      - alert: HighHTTP4xxRate
        expr: |
          sum(rate(http_requests_total{
            job=~"l[1-8]-.+",
            status=~"4.."
          }[5m])) by (service, namespace)
          /
          sum(rate(http_requests_total{job=~"l[1-8]-.+"}[5m])) by (service, namespace)
          > 0.20
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "高4xx错误率: {{ $labels.service }}"
          description: "{{ $labels.service }} 4xx 错误率超过 20%（当前: {{ $value | humanizePercentage }}）。"

  # ============================================================
  # 延迟告警
  # ============================================================
  - name: ilbuy.latency
    rules:

      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job=~"l[1-8]-.+"}[5m]))
            by (le, service, namespace)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "高P99延迟: {{ $labels.service }}"
          description: "{{ $labels.service }} P99 响应时间超过 2s（当前: {{ $value | humanizeDuration }}）。"

      - alert: CriticalP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job=~"l[1-8]-.+"}[5m]))
            by (le, service, namespace)
          ) > 5.0
        for: 3m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "严重延迟: {{ $labels.service }}"
          description: "{{ $labels.service }} P99 响应时间超过 5s（当前: {{ $value | humanizeDuration }}）。"

      - alert: AIDecisionSlowResponse
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{namespace="ilbuy-l2"}[5m]))
            by (le, service)
          ) > 1.5
        for: 5m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "AI决策层响应慢: {{ $labels.service }}"
          description: "L2 AI决策服务 P95 延迟超过 1.5s，可能影响推荐质量。"

  # ============================================================
  # 资源使用告警
  # ============================================================
  - name: ilbuy.resources
    rules:

      - alert: HighCPUUsage
        expr: |
          sum(rate(container_cpu_usage_seconds_total{
            namespace=~"ilbuy-.+",
            container!=""
          }[5m])) by (namespace, pod, container)
          /
          sum(kube_pod_container_resource_limits{
            namespace=~"ilbuy-.+",
            resource="cpu"
          }) by (namespace, pod, container)
          > 0.85
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "CPU 使用率过高: {{ $labels.pod }}/{{ $labels.container }}"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} CPU 使用率超过 85%（当前: {{ $value | humanizePercentage }}）。"

      - alert: HighMemoryUsage
        expr: |
          sum(container_memory_working_set_bytes{
            namespace=~"ilbuy-.+",
            container!=""
          }) by (namespace, pod, container)
          /
          sum(kube_pod_container_resource_limits{
            namespace=~"ilbuy-.+",
            resource="memory"
          }) by (namespace, pod, container)
          > 0.90
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "内存使用率过高: {{ $labels.pod }}/{{ $labels.container }}"
          description: "{{ $labels.namespace }}/{{ $labels.pod }} 内存使用率超过 90%（当前: {{ $value | humanizePercentage }}）。"

      - alert: PVCNearlyFull
        expr: |
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes
          < 0.15
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "PVC 空间不足: {{ $labels.persistentvolumeclaim }}"
          description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 剩余空间不足 15%。"

  # ============================================================
  # 业务指标告警
  # ============================================================
  - name: ilbuy.business
    rules:

      - alert: LowRecommendationAccuracy
        expr: |
          avg(ilbuy_recommendation_accuracy_ratio{namespace="ilbuy-l2"}) < 0.60
        for: 15m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "推荐准确率下降"
          description: "推荐系统准确率低于 60%（当前: {{ $value | humanizePercentage }}），可能需要触发模型重训练。"

      - alert: ModelIterationJobFailed
        expr: |
          increase(ilbuy_training_job_failed_total{namespace="ilbuy-l8"}[30m]) > 0
        for: 1m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "模型训练任务失败"
          description: "过去 30 分钟内有模型训练任务失败，请检查 model-iteration-svc。"

      - alert: FeedbackNegativeSurge
        expr: |
          sum(rate(ilbuy_feedback_negative_total{namespace="ilbuy-l8"}[30m]))
          /
          sum(rate(ilbuy_feedback_total{namespace="ilbuy-l8"}[30m]))
          > 0.30
        for: 10m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "负面反馈率上升"
          description: "过去 30 分钟负面反馈占比超过 30%（当前: {{ $value | humanizePercentage }}），需关注用户体验。"

      - alert: DeliveryFailureRateHigh
        expr: |
          sum(rate(ilbuy_delivery_failed_total{namespace="ilbuy-l6"}[15m]))
          /
          sum(rate(ilbuy_delivery_total{namespace="ilbuy-l6"}[15m]))
          > 0.10
        for: 5m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "交付失败率过高"
          description: "L6 交付层失败率超过 10%（当前: {{ $value | humanizePercentage }}），影响履约 SLA。"

      - alert: PaymentGatewayError
        expr: |
          sum(rate(ilbuy_payment_error_total{namespace="ilbuy-l7"}[5m])) > 0.5
        for: 3m
        labels:
          severity: critical
          team: payment
        annotations:
          summary: "支付网关错误频繁"
          description: "L7 支付服务每秒错误超过 0.5 次（当前: {{ $value | printf \"%.2f\" }}/s）。"

  # ============================================================
  # 基础设施告警
  # ============================================================
  - name: ilbuy.infrastructure
    rules:

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: dba
        annotations:
          summary: "PostgreSQL 不可用"
          description: "PostgreSQL 实例 {{ $labels.instance }} 已不可用。"

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 180
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "PostgreSQL 连接数过高"
          description: "PostgreSQL 连接数 {{ $value }}，接近最大限制 200。"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis 不可用"
          description: "Redis 实例 {{ $labels.instance }} 已不可用。"

      - alert: RabbitMQQueueDepth
        expr: rabbitmq_queue_messages_ready > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RabbitMQ 队列积压: {{ $labels.queue }}"
          description: "队列 {{ $labels.queue }} 积压消息超过 10000 条（当前: {{ $value }}）。"

      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Elasticsearch 集群 RED 状态"
          description: "ES 集群状态为 RED，存在数据丢失风险，请立即处理。"

      - alert: NacosNodeDown
        expr: up{job="nacos"} == 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Nacos 节点下线: {{ $labels.instance }}"
          description: "Nacos 节点 {{ $labels.instance }} 已不可用，配置中心可能受影响。"
