filebeat.inputs:
  # 采集所有 K8s Pod 的容器日志
  - type: container
    enabled: true
    paths:
      - /var/log/containers/*.log
    # 只采集 ilbuy 命名空间的日志
    processors:
      - drop_event:
          when:
            not:
              regexp:
                kubernetes.namespace: "^ilbuy-"

# Kubernetes 自动元数据丰富
processors:
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      matchers:
        - logs_path:
            logs_path: "/var/log/containers/"
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true
  - drop_fields:
      fields: ["agent.ephemeral_id", "ecs"]
      ignore_missing: true

# 输出到 Logstash
output.logstash:
  hosts:
    - "logstash.ilbuy-ops.svc.cluster.local:5044"
  loadbalance: true
  worker: 2
  bulk_max_size: 2048
  timeout: 30s

# 监控自身
monitoring.enabled: true
monitoring.elasticsearch:
  hosts:
    - "https://elasticsearch-client.ilbuy-ops.svc.cluster.local:9200"
  username: beats_system
  password: ${BEATS_PASSWORD}
  ssl.verification_mode: none

# 日志配置
logging.level: warning
logging.to_files: false

# 队列配置（防止日志爆发时丢失）
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s
