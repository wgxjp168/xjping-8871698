---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: ilbuy-ops
  labels:
    app: logstash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.13.4
          env:
            - name: LOGSTASH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: logstash-password
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 5044
              name: beats
            - containerPort: 9600
              name: monitoring
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /?pretty
              port: 9600
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: pipeline
          configMap:
            name: logstash-pipeline

---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: ilbuy-ops
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
    - name: monitoring
      port: 9600
      targetPort: 9600
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: ilbuy-ops
spec:
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
  type: ClusterIP
