# Logstash Pipeline — ILbuy 所有微服务日志解析
# 接收来自 Filebeat 的日志，解析后写入 Elasticsearch

input {
  beats {
    port => 5044
    ssl => false  # 生产环境改为 true，配置 SSL 证书
  }
}

filter {
  # ── 通用 JSON 解析 ──────────────────────────────────────────
  # 所有 ILbuy 微服务输出 JSON 格式日志
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
    # 提取标准字段
    if [app][timestamp] {
      date {
        match => ["[app][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }
    mutate {
      rename => {
        "[app][level]"     => "log_level"
        "[app][service]"   => "service_name"
        "[app][message]"   => "log_message"
        "[app][trace_id]"  => "trace_id"
        "[app][span_id]"   => "span_id"
        "[app][user_id]"   => "user_id"
        "[app][request_id]" => "request_id"
      }
      remove_field => ["message", "app"]
    }
  } else {
    # 非 JSON 日志（如 uvicorn access log）— 使用 grok
    grok {
      match => {
        "message" => [
          # uvicorn access log: INFO:     127.0.0.1:port - "GET /path HTTP/1.1" 200
          "%{WORD:log_level}:%{SPACE}%{IPORHOST:client_ip}:%{NUMBER:client_port} - \"%{WORD:http_method} %{URIPATHPARAM:http_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:http_status:int}",
          # 通用 Python log: 2024-01-01 12:00:00,123 INFO service: message
          "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{DATA:logger_name}: %{GREEDYDATA:log_message}"
        ]
      }
      overwrite => ["message"]
      tag_on_failure => ["_grokparsefailure"]
    }
    if [log_timestamp] {
      date {
        match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS", "ISO8601"]
        target => "@timestamp"
        remove_field => ["log_timestamp"]
      }
    }
  }

  # ── Kubernetes 元数据丰富 ────────────────────────────────────
  mutate {
    add_field => {
      "k8s_namespace" => "%{[kubernetes][namespace]}"
      "k8s_pod"       => "%{[kubernetes][pod][name]}"
      "k8s_container" => "%{[kubernetes][container][name]}"
      "k8s_node"      => "%{[kubernetes][node][name]}"
    }
  }

  # ── 服务层标记（根据 namespace 自动添加 layer 标签）──────────
  if [k8s_namespace] =~ /ilbuy-l1/ { mutate { add_field => { "ilbuy_layer" => "L1-user-profile" } } }
  else if [k8s_namespace] =~ /ilbuy-l2/ { mutate { add_field => { "ilbuy_layer" => "L2-ai-decision" } } }
  else if [k8s_namespace] =~ /ilbuy-l3/ { mutate { add_field => { "ilbuy_layer" => "L3-data-process" } } }
  else if [k8s_namespace] =~ /ilbuy-l4/ { mutate { add_field => { "ilbuy_layer" => "L4-data-storage" } } }
  else if [k8s_namespace] =~ /ilbuy-l5/ { mutate { add_field => { "ilbuy_layer" => "L5-report-generation" } } }
  else if [k8s_namespace] =~ /ilbuy-l6/ { mutate { add_field => { "ilbuy_layer" => "L6-delivery" } } }
  else if [k8s_namespace] =~ /ilbuy-l7/ { mutate { add_field => { "ilbuy_layer" => "L7-monetization" } } }
  else if [k8s_namespace] =~ /ilbuy-l8/ { mutate { add_field => { "ilbuy_layer" => "L8-feedback-optimize" } } }
  else if [k8s_namespace] =~ /ilbuy-ops/ { mutate { add_field => { "ilbuy_layer" => "L9-ops" } } }

  # ── 日志级别标准化 ──────────────────────────────────────────
  if [log_level] {
    mutate {
      uppercase => ["log_level"]
    }
  }

  # ── 错误日志特殊处理 ────────────────────────────────────────
  if [log_level] in ["ERROR", "CRITICAL"] {
    mutate {
      add_tag => ["error_log"]
    }
  }

  # ── HTTP 状态码分类 ─────────────────────────────────────────
  if [http_status] {
    if [http_status] >= 500 { mutate { add_field => { "http_status_class" => "5xx" } } }
    else if [http_status] >= 400 { mutate { add_field => { "http_status_class" => "4xx" } } }
    else if [http_status] >= 200 { mutate { add_field => { "http_status_class" => "2xx" } } }
  }

  # ── 清理不必要字段 ──────────────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "host", "tags"]
  }
}

output {
  # ── 写入 Elasticsearch ───────────────────────────────────────
  elasticsearch {
    hosts => ["https://elasticsearch-client.ilbuy-ops.svc.cluster.local:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => false  # 生产环境配置 CA 证书

    # 按日期和 namespace 分索引
    index => "ilbuy-logs-%{k8s_namespace}-%{+YYYY.MM.dd}"

    # ILM 策略
    ilm_enabled => true
    ilm_rollover_alias => "ilbuy-logs"
    ilm_policy => "ilbuy-log-policy"
  }

  # ── 错误日志额外写入专用索引 ────────────────────────────────
  if "error_log" in [tags] {
    elasticsearch {
      hosts => ["https://elasticsearch-client.ilbuy-ops.svc.cluster.local:9200"]
      user => "logstash_internal"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
      index => "ilbuy-errors-%{+YYYY.MM.dd}"
    }
  }
}
