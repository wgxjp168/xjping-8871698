[PARSER]
    Name        json_parser
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

# uvicorn access log 格式
[PARSER]
    Name        uvicorn_access
    Format      regex
    Regex       (?<client_ip>\d+\.\d+\.\d+\.\d+):\d+ - "(?<http_method>\w+) (?<http_path>[^ ]+) HTTP/(?<http_version>[\d.]+)" (?<http_status>\d+)
    Types       http_status:integer

# Spring Boot 标准日志格式
[PARSER]
    Name        spring_boot
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+(?<level>[A-Z]+)\s+\d+ --- \[(?<thread>[^\]]+)\] (?<logger>[^\s:]+)\s*:\s*(?<message>.+)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L
