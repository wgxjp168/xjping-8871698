[SERVICE]
    Flush         5
    Log_Level     warn
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ─── INPUT: 采集 K8s Pod 容器日志 ─────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               kube.<namespace_name>.<pod_name>.<container_name>
    Tag_Regex         (?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-
    Path              /var/log/containers/*.log
    multiline.parser  docker, cri
    DB                /var/log/flb_kube.db
    DB.sync           Normal
    Mem_Buf_Limit     32MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Rotate_Wait       30
    Read_from_Head    false

# ─── FILTER: 只保留 ilbuy-* 命名空间 ────────────────────────────────────
[FILTER]
    Name    grep
    Match   kube.*
    Regex   $kubernetes['namespace_name'] ^ilbuy-

# ─── FILTER: K8s 元数据丰富（注入 pod/namespace/container/label 信息）────
[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    Keep_Log            Off
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On
    Annotations         Off
    Labels              On

# ─── FILTER: 修改字段 — 统一 ILbuy 层级标签 ────────────────────────────
[FILTER]
    Name    lua
    Match   kube.*
    script  /fluent-bit/scripts/add_layer.lua
    call    add_ilbuy_layer

# ─── FILTER: 解析 JSON 日志体 ──────────────────────────────────────────
[FILTER]
    Name         parser
    Match        kube.*
    Key_Name     log
    Parser       json_parser
    Reserve_Data On
    Preserve_Key Off

# ─── FILTER: 过滤探针日志（减少噪音）────────────────────────────────────
[FILTER]
    Name    grep
    Match   kube.*
    Exclude $kubernetes['labels']['app'] kube-probe

# ─── OUTPUT: 发送到 Elasticsearch ──────────────────────────────────────
[OUTPUT]
    Name            es
    Match           kube.*
    Host            elasticsearch-client.ilbuy-ops.svc.cluster.local
    Port            9200
    HTTP_User       fluentbit
    HTTP_Passwd     ${FLUENTBIT_ES_PASSWORD}
    Index           ilbuy-logs
    Logstash_Format On
    Logstash_Prefix ilbuy-logs
    Logstash_DateFormat %Y.%m.%d
    Type            _doc
    Retry_Limit     5
    tls             On
    tls.verify      Off
    # 批量写入优化
    Buffer_Size     False
    Compress        gzip

# ─── OUTPUT: 错误日志额外发送到告警 index ────────────────────────────────
[OUTPUT]
    Name            es
    Match           kube.*
    Host            elasticsearch-client.ilbuy-ops.svc.cluster.local
    Port            9200
    HTTP_User       fluentbit
    HTTP_Passwd     ${FLUENTBIT_ES_PASSWORD}
    Index           ilbuy-errors
    Logstash_Format On
    Logstash_Prefix ilbuy-errors
    Logstash_DateFormat %Y.%m.%d
    Type            _doc
    tls             On
    tls.verify      Off
