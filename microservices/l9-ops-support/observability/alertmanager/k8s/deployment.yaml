---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ilbuy-ops
data:
  alertmanager.yml: |
    # 生产部署时执行：
    # kubectl create configmap alertmanager-config \
    #   --from-file=alertmanager.yml=observability/alertmanager/alertmanager.yml \
    #   -n ilbuy-ops

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: ilbuy-ops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ilbuy-ssd
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: ilbuy-ops
  labels:
    app: alertmanager
spec:
  replicas: 2
  serviceName: alertmanager
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.peer=alertmanager-0.alertmanager.ilbuy-ops.svc.cluster.local:9094
            - --cluster.peer=alertmanager-1.alertmanager.ilbuy-ops.svc.cluster.local:9094
            - --web.external-url=https://alertmanager.ilbuy.internal
          ports:
            - containerPort: 9093
              name: http
            - containerPort: 9094
              name: cluster
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
            - name: secrets
              mountPath: /etc/alertmanager
              readOnly: true
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: alertmanager-secrets
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ilbuy-ops
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
    - name: cluster
      port: 9094
      targetPort: 9094
  type: ClusterIP
