# ILbuy Nginx Ingress 路由配置
# 依赖: ingress-nginx controller + cert-manager（自动 TLS）
---
# TLS 证书 Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ilbuy-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@ilbuy.internal
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# 运维工具面板
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ilbuy-ops-ingress
  namespace: ilbuy-ops
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: ilbuy-letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: ops-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "ILbuy Ops Dashboard"
spec:
  tls:
    - hosts:
        - grafana.ilbuy.internal
        - prometheus.ilbuy.internal
        - alertmanager.ilbuy.internal
        - jaeger.ilbuy.internal
        - kibana.ilbuy.internal
        - nacos.ilbuy.internal
        - jenkins.ilbuy.internal
        - sonar.ilbuy.internal
      secretName: ilbuy-ops-tls
  rules:
    - host: grafana.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

    - host: prometheus.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090

    - host: alertmanager.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093

    - host: jaeger.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686

    - host: kibana.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana
                port:
                  number: 5601

    - host: nacos.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nacos-client
                port:
                  number: 8848

    - host: jenkins.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080

    - host: sonar.ilbuy.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  number: 9000

---
# 微服务 API 入口（L1-L8 对外路由）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ilbuy-api-ingress
  namespace: ilbuy-l2
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: ilbuy-letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - api.ilbuy.internal
      secretName: ilbuy-api-tls
  rules:
    - host: api.ilbuy.internal
      http:
        paths:
          # L2 AI决策层（推荐接口）
          - path: /api/v1/recommendation
            pathType: Prefix
            backend:
              service:
                name: decision-svc
                port:
                  number: 8012
          # L5 报告生成
          - path: /api/v1/reports
            pathType: Prefix
            backend:
              service:
                name: report-generate-svc
                port:
                  number: 8051
          # L6 交付
          - path: /api/v1/delivery
            pathType: Prefix
            backend:
              service:
                name: delivery-svc
                port:
                  number: 8061
          # L8 反馈
          - path: /api/v1/feedback
            pathType: Prefix
            backend:
              service:
                name: feedback-svc
                port:
                  number: 8060
