# ILbuy 共享持久化存储 PVC 配置
---
# 模型存储（L8 model-iteration-svc + model-deploy-svc 共享）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ilbuy-model-store-pvc
  namespace: ilbuy-l8
  labels:
    usage: model-store
spec:
  accessModes: [ReadWriteMany]  # 多 Pod 读写（NFS 或 Ceph）
  storageClassName: ilbuy-nfs
  resources:
    requests:
      storage: 50Gi

---
# L5 报告 PDF 存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ilbuy-report-store-pvc
  namespace: ilbuy-l5
  labels:
    usage: report-store
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ilbuy-nfs
  resources:
    requests:
      storage: 100Gi

---
# Jenkins 持久化数据
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data
  namespace: ilbuy-ops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ilbuy-ssd
  resources:
    requests:
      storage: 50Gi

---
# 存储类定义（ilbuy-ssd — 本地 SSD）
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ilbuy-ssd
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: kubernetes.io/no-provisioner  # 替换为实际 CSI Driver: rancher.io/local-path 或 ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true

---
# 存储类定义（ilbuy-nfs — 共享 NFS）
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ilbuy-nfs
provisioner: nfs.csi.k8s.io  # 替换为实际 NFS CSI Driver
volumeBindingMode: Immediate
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  server: "nfs.ilbuy-infra.svc.cluster.local"
  share: "/exports/ilbuy"
  mountPermissions: "0755"
