# ══════════════════════════════════════════════════════════════════
# L5 — 报告生成层（CPU 密集型，任务队列扩容）
# ══════════════════════════════════════════════════════════════════
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-generate-svc-hpa
  namespace: ilbuy-l5
  labels:
    layer: l5
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-generate-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # PDF 生成极耗 CPU
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # RabbitMQ 队列深度作为扩容依据（需 KEDA 或自定义指标）
    - type: External
      external:
        metric:
          name: rabbitmq_queue_messages_ready
          selector:
            matchLabels:
              queue: report-generation
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120

