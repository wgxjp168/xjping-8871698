# ILbuy 全层 HPA（Horizontal Pod Autoscaler）配置
# K8s 1.29 — 使用 autoscaling/v2，支持 CPU/内存/自定义指标（QPS/P99）
# 前置依赖：metrics-server + prometheus-adapter（自定义指标）
#
# 安装 metrics-server:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# 安装 prometheus-adapter（自定义 QPS 指标）:
#   helm install prometheus-adapter prometheus-community/prometheus-adapter \
#     --set prometheus.url=http://prometheus.ilbuy-ops.svc.cluster.local \
#     -n ilbuy-ops

# ══════════════════════════════════════════════════════════════════
# L1 — 用户权益层
# ══════════════════════════════════════════════════════════════════
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-profile-svc-hpa
  namespace: ilbuy-l1
  labels:
    layer: l1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-profile-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "200"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min

# ══════════════════════════════════════════════════════════════════
# L2 — AI 决策层（推荐系统请求量大，扩容更激进）
# ══════════════════════════════════════════════════════════════════
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: decision-svc-hpa
  namespace: ilbuy-l2
  labels:
    layer: l2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: decision-svc
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "150"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600   # AI 服务缩容更保守
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
      selectPolicy: Min

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-serving-svc-hpa
  namespace: ilbuy-l2
  labels:
    layer: l2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving-svc
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # 模型推理 CPU 密集，阈值低
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    # 预测延迟自定义指标（P99 > 1s 时扩容）
    - type: Object
      object:
        metric:
          name: http_request_p99_latency_seconds
        describedObject:
          apiVersion: apps/v1
          kind: Deployment
          name: model-serving-svc
        target:
          type: Value
          value: "1"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
      selectPolicy: Min

