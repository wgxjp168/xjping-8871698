  kind: ClusterRole
  name: ilbuy-service-role
subjects:
  - kind: ServiceAccount
    name: ilbuy-svc
    namespace: ilbuy-l6

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ilbuy-svc-binding
  namespace: ilbuy-l7
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
