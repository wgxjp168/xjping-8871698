metadata:
  name: ilbuy-svc-binding
  namespace: ilbuy-l4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ilbuy-service-role
subjects:
  - kind: ServiceAccount
