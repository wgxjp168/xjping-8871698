# ILbuy 全层命名空间 + 资源配额 + LimitRange
---
apiVersion: v1
kind: Namespace
metadata:
  name: ilbuy-l1
  labels:
    layer: l1-user-profile
    team: platform
    managed-by: ops

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: l1-quota
  namespace: ilbuy-l1
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    persistentvolumeclaims: "10"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: l1-limits
  namespace: ilbuy-l1
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi

---
apiVersion: v1
