apiVersion: v1
kind: ConfigMap
metadata:
  name: supplier-svc-config
  namespace: ilbuy-l5
  labels:
    app: supplier-svc
    layer: l5
    env: development
data:
  ENV: "development"
  SERVER_PORT: "8030"
  DB_HOST: "localhost"
  DB_PORT: "3306"
  DB_NAME: "ilbuy_supplier"
  DB_URL: "jdbc:mysql://localhost:3306/ilbuy_supplier?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  REDIS_DB: "6"
  LOG_LEVEL: "DEBUG"
  JWT_EXPIRATION_MS: "86400000"
  JAVA_OPTS: "-Xms128m -Xmx256m"
