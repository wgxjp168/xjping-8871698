server:
  port: 8030

spring:
  application:
    name: supplier-svc
  datasource:
    url: jdbc:mysql://localhost:3306/ilbuy_supplier?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}

jwt:
  secret: ${JWT_SECRET:ilbuy-user-svc-secret-key-must-be-at-least-32-chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.ilbuy: DEBUG
