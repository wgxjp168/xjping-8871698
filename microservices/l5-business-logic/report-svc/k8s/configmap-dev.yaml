apiVersion: v1
kind: ConfigMap
metadata:
  name: report-svc-config
  namespace: ilbuy-l5
  labels:
    app: report-svc
    layer: l5
    env: development
data:
  ENV: "development"
  SERVER_PORT: "8024"
  DB_HOST: "localhost"
  DB_PORT: "3306"
  DB_NAME: "ilbuy_report"
  DB_URL: "jdbc:mysql://localhost:3306/ilbuy_report?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  REDIS_DB: "4"
  RABBIT_HOST: "localhost"
  RABBIT_PORT: "5672"
  RABBIT_VHOST: "/ilbuy"
  LOG_LEVEL: "DEBUG"
  JWT_EXPIRATION_MS: "86400000"
  JAVA_OPTS: "-Xms128m -Xmx256m"
