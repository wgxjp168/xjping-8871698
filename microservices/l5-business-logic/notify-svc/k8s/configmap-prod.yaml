apiVersion: v1
kind: ConfigMap
metadata:
  name: notify-svc-config
  namespace: ilbuy-l5
  labels:
    app: notify-svc
    layer: l5
    env: production
data:
  ENV: "production"
  SERVER_PORT: "8040"
  DB_HOST: "mysql.ilbuy-infra.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "ilbuy_notify"
  DB_URL: "jdbc:mysql://mysql.ilbuy-infra.svc.cluster.local:3306/ilbuy_notify?useSSL=true&characterEncoding=UTF-8&serverTimezone=UTC&requireSSL=true"
  REDIS_HOST: "redis.ilbuy-infra.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "6"
  RABBIT_HOST: "rabbitmq.ilbuy-infra.svc.cluster.local"
  RABBIT_PORT: "5672"
  RABBIT_VHOST: "/ilbuy"
  LOG_LEVEL: "WARN"
  JAVA_OPTS: "-server -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
