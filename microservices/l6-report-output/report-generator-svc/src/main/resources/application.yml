server:
  port: 8061
  servlet:
    context-path: /

spring:
  application:
    name: report-generator-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ilbuy_l6}
    username: ${DB_USERNAME:ilbuy}
    password: ${DB_PASSWORD:ilbuy123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        prefetch: 5
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0

# L5 Report Service client
l5:
  report-svc:
    base-url: ${L5_REPORT_SVC_URL:http://localhost:8051}
    timeout: 30000

# L6 Format Output Service
l6:
  format-output-svc:
    base-url: ${L6_FORMAT_OUTPUT_SVC_URL:http://localhost:8062}
    timeout: 60000

# RabbitMQ queues
rabbitmq:
  exchange:
    l5-report: l5.report.exchange
    l6-generator: l6.generator.exchange
  queue:
    report-generate-request: l6.report.generate.request
    report-generate-b2b: l6.report.generate.b2b
    report-generate-b2c-defined: l6.report.generate.b2c.defined
    report-generate-b2c-undefined: l6.report.generate.b2c.undefined
    report-generate-result: l6.report.generate.result
    report-generate-dlq: l6.report.generate.dlq
  routing-key:
    b2b: report.b2b
    b2c-defined: report.b2c.defined
    b2c-undefined: report.b2c.undefined
    result: report.result

# JWT (shared secret with L5)
jwt:
  secret: ${JWT_SECRET:ilbuy-jwt-secret-key-2024-production-use-256bit}
  expiration: 86400000

# Report generation settings
report:
  generator:
    async: true
    thread-pool-size: 10
    max-retries: 3
    cache-ttl: 3600
  template:
    b2b:
      sections:
        - EXECUTIVE_SUMMARY
        - SUPPLIER_LANDSCAPE
        - PRICE_BENCHMARKS
        - COMPLIANCE_CHECK
        - RISK_ASSESSMENT
        - PROCUREMENT_RECOMMENDATIONS
    b2c-defined:
      sections:
        - BRAND_ANALYSIS
        - PRICE_COMPARISON
        - COMPETITOR_MAPPING
        - CHANNEL_PERFORMANCE
        - MARKET_SHARE
        - STRATEGIC_INSIGHTS
    b2c-undefined:
      sections:
        - MARKET_OVERVIEW
        - CATEGORY_TRENDS
        - BRAND_DISCOVERY
        - PRICE_RANGE_ANALYSIS
        - CONSUMER_SENTIMENT
        - ENTRY_STRATEGY

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.ilbuy: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
