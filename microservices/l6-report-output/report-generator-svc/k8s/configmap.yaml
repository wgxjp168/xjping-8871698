# NOTICE: The shared ConfigMap for the entire L6 layer is defined in:
#   microservices/l6-report-output/k8s/configmap.yaml
#
# DO NOT define an ilbuy-l6-config ConfigMap here.
# Two files creating the same ConfigMap in the same namespace will
# overwrite each other depending on apply order; the global file is
# the authoritative source and contains all required keys.
#
# Apply order before deploying any L6 service:
#   kubectl apply -f ../../k8s/namespace.yaml
#   kubectl apply -f ../../k8s/configmap.yaml
#   kubectl apply -f deployment.yaml
