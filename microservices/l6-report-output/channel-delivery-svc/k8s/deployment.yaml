apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-delivery-svc
  namespace: ilbuy-l6
  labels:
    app: channel-delivery-svc
    layer: l6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: channel-delivery-svc
  template:
    metadata:
      labels:
        app: channel-delivery-svc
        layer: l6
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8063"
    spec:
      serviceAccountName: ilbuy-svc
      containers:
        - name: channel-delivery-svc
          image: ilbuy/channel-delivery-svc:latest
          ports:
            - containerPort: 8063
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l6-config
                  key: db.host
            - name: DB_NAME
              value: "ilbuy_l6"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l6-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l6-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l6-config
                  key: redis.host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-redis-secret
                  key: password
            - name: EMAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l6-config
                  key: email.host
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: ilbuy-email-secret
                  key: username
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: ilbuy-email-secret
                  key: password
            - name: WECHAT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ilbuy-wechat-secret
                  key: app-id
            - name: WECHAT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilbuy-wechat-secret
                  key: app-secret
            - name: WECHAT_TEMPLATE_ID
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l6-config
                  key: wechat.template-id
            - name: PUSH_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l6-config
                  key: push.gateway.url
            - name: PUSH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ilbuy-push-secret
                  key: api-key
            - name: WEB_PORTAL_URL
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l6-config
                  key: web.portal.url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilbuy-jwt-secret
                  key: secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8063
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8063
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: channel-delivery-svc
  namespace: ilbuy-l6
spec:
  type: ClusterIP
  selector:
    app: channel-delivery-svc
  ports:
    - name: http
      port: 8063
      targetPort: 8063
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: channel-delivery-svc-hpa
  namespace: ilbuy-l6
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channel-delivery-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
