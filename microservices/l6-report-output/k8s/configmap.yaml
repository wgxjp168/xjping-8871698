apiVersion: v1
kind: ConfigMap
metadata:
  name: ilbuy-l6-config
  namespace: ilbuy-l6
  labels:
    app.kubernetes.io/part-of: ilbuy
    layer: l6
data:
  # Infrastructure
  db.host: "postgres-master.ilbuy-infra.svc.cluster.local"
  db.port: "5432"
  redis.host: "redis-master.ilbuy-infra.svc.cluster.local"
  redis.port: "6379"
  rabbitmq.host: "rabbitmq.ilbuy-infra.svc.cluster.local"
  rabbitmq.port: "5672"

  # MinIO
  minio.endpoint: "http://minio.ilbuy-infra.svc.cluster.local:9000"

  # L5 services
  l5.report-svc.url: "http://report-svc.ilbuy-l5.svc.cluster.local:8051"

  # L6 services (intra-layer)
  l6.format-output-svc.url: "http://format-output-svc.ilbuy-l6.svc.cluster.local:8062"
  l6.channel-delivery-svc.url: "http://channel-delivery-svc.ilbuy-l6.svc.cluster.local:8063"

  # Email
  email.host: "smtp.exmail.qq.com"
  email.port: "465"
  email.secure: "true"
  email.from: "我来购ILbuy <noreply@ilbuy.com>"

  # WeChat Official Account
  wechat.template-id: "your_wechat_template_id_here"
  wechat.api-base: "https://api.weixin.qq.com"

  # Mobile Push
  push.gateway.url: "https://push.ilbuy.com"

  # Web Portal
  web.portal.url: "https://app.ilbuy.com"
  cors.origins: "https://app.ilbuy.com,https://m.ilbuy.com"
---
# Secret templates (values must be base64 encoded before applying)
