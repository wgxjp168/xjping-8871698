---
apiVersion: v1
kind: Service
metadata:
  name: data-svc
  namespace: ilbuy-l4
  labels:
    app: data-svc
    layer: l4
spec:
  type: ClusterIP
  selector:
    app: data-svc
  ports:
    - name: http
      port: 8035
      targetPort: 8035

---
# HPA — CPU / 内存双维度自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-svc-hpa
  namespace: ilbuy-l4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-svc
  namespace: ilbuy-l4
