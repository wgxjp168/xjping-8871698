apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-svc
  namespace: ilbuy-l3
  labels:
    app: etl-svc
    tier: l3-data
    component: etl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: etl-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: etl-svc
        tier: l3-data
        component: etl
    spec:
      serviceAccountName: etl-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: etl-svc
          image: ilbuy/etl-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8031
              protocol: TCP
          envFrom:
            - configMapRef:
                name: etl-svc-config-prod
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 18        # 最多等待 90 秒启动
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: etl-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etl-svc
  namespace: ilbuy-l3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-svc-config
  namespace: ilbuy-l3
data:
  redis_url:         "redis://redis.ilbuy-infra.svc.cluster.local:6379/3"
  l4_ingest_enabled: "false"
  max_batch_size:    "1000"
  weight_price:      "0.25"
  weight_popularity: "0.25"
  weight_rating:     "0.25"
  weight_availability: "0.15"
  weight_value:      "0.10"
