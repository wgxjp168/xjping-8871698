apiVersion: v1
kind: Service
metadata:
  name: etl-svc
  namespace: ilbuy-l3
  labels:
    app: etl-svc
    tier: l3-data
spec:
  type: ClusterIP
  selector:
    app: etl-svc
  ports:
    - name: http
      port: 8031
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: etl-svc-hpa
  namespace: ilbuy-l3
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: etl-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
