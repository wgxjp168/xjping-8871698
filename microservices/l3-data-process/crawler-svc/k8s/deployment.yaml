apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-svc
  namespace: ilbuy-l3
  labels:
    app: crawler-svc
    tier: l3-data
    component: crawler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crawler-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: crawler-svc
        tier: l3-data
        component: crawler
    spec:
      serviceAccountName: crawler-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 60
      containers:
        - name: crawler-svc
          image: ilbuy/crawler-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8030
              protocol: TCP
          envFrom:
            - configMapRef:
                name: crawler-svc-config-prod
            - secretRef:
                name: platform-api-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24        # 最多等待 2 分钟（APScheduler + 连接池初始化）
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: crawler-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crawler-svc
  namespace: ilbuy-l3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crawler-svc-config
  namespace: ilbuy-l3
data:
  redis_url:     "redis://redis.ilbuy-infra.svc.cluster.local:6379/2"
  proxy_enabled: "false"
  taobao_rpm:    "30"
  jd_rpm:        "60"
  pdd_rpm:       "40"
---
# Secret template — populate via CI/CD or external-secrets operator
apiVersion: v1
kind: Secret
metadata:
  name: platform-api-secrets
  namespace: ilbuy-l3
  annotations:
    note: "Populate via CI/CD pipeline — do NOT commit real keys"
type: Opaque
stringData:
  taobao_app_key:    ""
  taobao_app_secret: ""
  jd_app_key:        ""
  jd_app_secret:     ""
  ali1688_app_key:   ""
  ali1688_app_secret: ""
  pdd_client_id:     ""
  pdd_client_secret: ""
  vipshop_app_key:   ""
  suning_app_key:    ""
  douyin_app_key:    ""
  douyin_app_secret: ""
