# ===== Dev 环境配置 =====
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: DEFAULT_GROUP

# 开发环境：语音/图像识别均使用 Mock，无需真实 API Key
ilbuy:
  voice:
    baidu:
      enabled: false      # dev不调用真实百度API
    ifly:
      enabled: false
  image:
    mock-enabled: true    # dev启用Mock图像识别

logging:
  level:
    com.ilbuy: DEBUG
    org.springframework.security: DEBUG
