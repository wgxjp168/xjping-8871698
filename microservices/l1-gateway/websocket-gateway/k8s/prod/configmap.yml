apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-gateway-config
  namespace: ilbuy-prod
  labels:
    app: websocket-gateway
    env: prod
data:
  # ── 应用配置（生产环境） ──
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8090"
  NACOS_ADDR: "nacos-headless.ilbuy-prod:8848"
  NACOS_NAMESPACE: "prod"
  REDIS_HOST: "redis-master.ilbuy-prod"
  REDIS_PORT: "6379"

  # WebSocket 配置
  WS_MAX_TEXT_MESSAGE_SIZE: "65536"   # 64KB 最大文本消息
  WS_MAX_BINARY_MESSAGE_SIZE: "65536"
  WS_SESSION_TTL_HOURS: "25"

  # 日志级别（生产环境 INFO）
  LOGGING_LEVEL_COM_ILBUY: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_SOCKET: "WARN"
