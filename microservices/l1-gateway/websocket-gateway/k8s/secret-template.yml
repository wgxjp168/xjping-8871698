# ============================================================
#  websocket-gateway Secret 模板
#  使用前请将 <base64_encoded_*> 替换为实际值
#  生成方式：echo -n "your_value" | base64
# ============================================================

---
# 开发环境
apiVersion: v1
kind: Secret
metadata:
  name: websocket-gateway-secret
  namespace: ilbuy-dev
  labels:
    app: websocket-gateway
    env: dev
type: Opaque
data:
  # 与 api-gateway 使用相同的 JWT 密钥（用于 Handshake 验签）
  JWT_SECRET: <base64_encoded_jwt_secret>
  REDIS_PASSWORD: <base64_encoded_redis_password>

---
# 生产环境
apiVersion: v1
kind: Secret
metadata:
  name: websocket-gateway-secret
  namespace: ilbuy-prod
  labels:
    app: websocket-gateway
    env: prod
type: Opaque
data:
  JWT_SECRET: <base64_encoded_jwt_secret>
  REDIS_PASSWORD: <base64_encoded_redis_password>
