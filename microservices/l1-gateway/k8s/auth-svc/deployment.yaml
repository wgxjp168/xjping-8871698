apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-svc
  namespace: ilbuy
  labels:
    app: auth-svc
    layer: l1-gateway
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-svc
        layer: l1-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8001"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-svc
          image: registry.ilbuy.com/ilbuy/auth-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: NACOS_SERVER_ADDR
              value: "nacos:8848"
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_HOST
              value: "mysql-master"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "ilbuy_auth"
            - name: DB_USER
              value: "ilbuy_auth"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l1-secret
                  key: JWT_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l1-secret
                  key: REDIS_PASSWORD
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l1-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
