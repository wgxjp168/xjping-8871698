version: "3.8"

# =============================================================
#  Kong API 网关本地开发/测试环境
#  启动命令：docker-compose -f docker-compose.kong.yml up -d
# =============================================================

services:

  # ── Kong 数据库（PostgreSQL）──
  kong-database:
    image: postgres:15-alpine
    container_name: kong-database
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpassword
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kong-net

  # ── Kong 数据库迁移（首次启动） ──
  kong-migration:
    image: kong:3.6-alpine
    container_name: kong-migration
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword
    networks:
      - kong-net
    restart: on-failure

  # ── Kong 网关实例 ──
  kong:
    image: kong:3.6-alpine
    container_name: kong
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpassword

      # 代理端口
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_LISTEN_SSL: 0.0.0.0:8443

      # Admin API（仅内网访问）
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002

      # 日志
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr

      # 插件
      KONG_PLUGINS: bundled,custom-auth

      # DNS 解析（Kubernetes 环境改为 kube-dns）
      KONG_DNS_RESOLVER: 127.0.0.11

      # Redis 配置（供限流插件使用）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

    ports:
      - "8000:8000"    # HTTP 代理
      - "8443:8443"    # HTTPS 代理
      - "8001:8001"    # Admin API（生产禁止公网暴露）
      - "8002:8002"    # Kong Manager（Web UI）
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
      - kong-logs:/var/log/kong
    networks:
      - kong-net
    restart: unless-stopped

  # ── Redis（Kong 限流存储） ──
  redis:
    image: redis:7-alpine
    container_name: kong-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"    # 映射 6380 避免与业务 Redis 冲突
    volumes:
      - kong-redis-data:/data
    networks:
      - kong-net

  # ── deck（声明式配置同步工具） ──
  # 用法：docker-compose run --rm deck gateway sync /etc/kong/kong.yml
  deck:
    image: kong/deck:latest
    container_name: kong-deck
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    environment:
      DECK_KONG_ADDR: http://kong:8001
    networks:
      - kong-net
    profiles:
      - tools            # 默认不启动，按需：docker-compose --profile tools run deck

volumes:
  kong-db-data:
  kong-redis-data:
  kong-logs:

networks:
  kong-net:
    driver: bridge
