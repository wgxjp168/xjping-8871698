---
# ── 开发环境 Service ──
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ilbuy-dev
  labels:
    app: api-gateway
    env: dev
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
# ── 生产环境 Service（LoadBalancer，对外暴露） ──
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ilbuy-prod
  labels:
    app: api-gateway
    env: prod
  annotations:
    # 云厂商 LoadBalancer 注解（按实际环境调整）
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-spec: "slb.s2.small"
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-health-check-type: "http"
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-health-check-uri: "/actuator/health"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None
  externalTrafficPolicy: Local      # 保留客户端真实 IP
