apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: ilbuy-prod
  labels:
    app: api-gateway
    env: prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70       # CPU 使用率超 70% 触发扩容
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80       # 内存使用率超 80% 触发扩容
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # 扩容稳定窗口（快速响应）
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300 # 缩容稳定窗口（防止抖动）
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
