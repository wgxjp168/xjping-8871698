apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ilbuy-prod
  labels:
    app: api-gateway
    env: prod
data:
  # ── 应用配置（生产环境） ──
  SPRING_PROFILES_ACTIVE: "prod"
  NACOS_ADDR: "nacos-headless.ilbuy-prod:8848"
  NACOS_NAMESPACE: "prod"
  REDIS_HOST: "redis-master.ilbuy-prod"
  REDIS_PORT: "6379"
  SENTINEL_DASHBOARD: "sentinel-dashboard.ilbuy-prod:8080"

  # 日志级别（生产环境 INFO，减少日志量）
  LOGGING_LEVEL_COM_ILBUY: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "WARN"
  LOGGING_LEVEL_REACTOR_NETTY: "WARN"
