# ============================================================
#  api-gateway Secret 模板
#  使用前请将 <base64_encoded_*> 替换为实际值
#  生成方式：echo -n "your_value" | base64
#  部署命令：kubectl apply -f secret-template.yml -n <namespace>
# ============================================================

---
# 开发环境
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: ilbuy-dev
  labels:
    app: api-gateway
    env: dev
type: Opaque
data:
  # echo -n "dev-jwt-secret-at-least-32-chars!!" | base64
  JWT_SECRET: <base64_encoded_jwt_secret>
  # echo -n "dev-redis-password" | base64
  REDIS_PASSWORD: <base64_encoded_redis_password>

---
# 生产环境
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: ilbuy-prod
  labels:
    app: api-gateway
    env: prod
type: Opaque
data:
  # 生产环境请使用足够强度的随机密钥（至少 64 位）
  # echo -n "prod-jwt-secret-must-be-strong-and-long!!" | base64
  JWT_SECRET: <base64_encoded_jwt_secret>
  # echo -n "prod-redis-strong-password" | base64
  REDIS_PASSWORD: <base64_encoded_redis_password>
