apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: ilbuy-dev
  labels:
    app: api-gateway
    env: dev
data:
  # ── 应用配置（开发环境） ──
  SPRING_PROFILES_ACTIVE: "dev"
  NACOS_ADDR: "nacos-headless.ilbuy-dev:8848"
  NACOS_NAMESPACE: "dev"
  REDIS_HOST: "redis-master.ilbuy-dev"
  REDIS_PORT: "6379"
  SENTINEL_DASHBOARD: "sentinel-dashboard.ilbuy-dev:8080"

  # 日志级别（开发环境调试级别）
  LOGGING_LEVEL_COM_ILBUY: "DEBUG"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "DEBUG"
  LOGGING_LEVEL_REACTOR_NETTY: "INFO"
