apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-svc
  namespace: ilbuy-l2
  labels:
    app: llm-svc
    component: ai-decision
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: llm-svc
        component: ai-decision
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: llm-svc
          image: ilbuy/llm-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8011
              protocol: TCP
          env:
            - name: ENV
              value: "production"
            - name: PORT
              value: "8011"
          envFrom:
            - secretRef:
                name: llm-svc-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroup: 1001
---
# Secret template (values must be base64-encoded and managed via Sealed Secrets
# or an external secrets manager in production).
# This manifest is provided as a reference; do NOT commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: llm-svc-secrets
  namespace: ilbuy-l2
  annotations:
    # Replace with actual secret management solution in production
    note: "Populate via CI/CD pipeline or external-secrets operator"
type: Opaque
stringData:
  LLM_PROVIDER: "openai"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: "gpt-4o"
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_MODEL: "claude-opus-4-6"
  WENXIN_API_KEY: ""
  WENXIN_SECRET_KEY: ""
