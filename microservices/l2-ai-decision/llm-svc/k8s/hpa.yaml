apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-svc-hpa
  namespace: ilbuy-l2
  labels:
    app: llm-svc
    tier: l2-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-svc
  minReplicas: 2
  maxReplicas: 8            # LLM 调用高并发时可扩容更多实例
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60      # LLM 调用 I/O 密集，CPU 阈值稍低
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15  # LLM 流量突发响应快
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
