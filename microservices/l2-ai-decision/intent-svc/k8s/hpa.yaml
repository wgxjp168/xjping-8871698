apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intent-svc-hpa
  namespace: ilbuy-l2
  labels:
    app: intent-svc
    tier: l2-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intent-svc
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65       # NLP 推理 CPU 密集，阈值稍低
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # intent-svc 冷启动较慢，稳定窗口稍长
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
