version: "3.9"

services:
  # ── 基础设施 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── L2 微服务 ─────────────────────────────────────────────
  dialog-svc:
    build: ./dialog-svc
    ports: ["8013:8013"]
    environment:
      - NODE_ENV=development
      - PORT=8013
      - REDIS_URL=redis://redis:6379
      - INTENT_SVC_URL=http://intent-svc:8010
      - DECISION_SVC_URL=http://decision-svc:8012
      - AUTH_SVC_URL=${AUTH_SVC_URL:-http://auth-svc:8001}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  intent-svc:
    build: ./intent-svc
    ports: ["8010:8010"]
    environment:
      - ENV=development
      - LLM_SVC_URL=http://llm-svc:8011
      - HF_MODEL_NAME=${HF_MODEL_NAME:-hfl/chinese-roberta-wwm-ext}
      - NLP_DEVICE=${NLP_DEVICE:-cpu}
    restart: unless-stopped

  llm-svc:
    build: ./llm-svc
    ports: ["8011:8011"]
    environment:
      - ENV=development
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WENXIN_API_KEY=${WENXIN_API_KEY:-}
      - WENXIN_SECRET_KEY=${WENXIN_SECRET_KEY:-}
    restart: unless-stopped

  decision-svc:
    build: ./decision-svc
    ports: ["8012:8012"]
    environment:
      - ENV=development
      - INTENT_SVC_URL=http://intent-svc:8010
      - LLM_SVC_URL=http://llm-svc:8011
      - L3_DATA_SVC_URL=${L3_DATA_SVC_URL:-http://data-svc:8020}
    restart: unless-stopped

volumes:
  redis_data:
