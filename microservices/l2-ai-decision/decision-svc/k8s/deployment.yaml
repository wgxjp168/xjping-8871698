apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-svc
  namespace: ilbuy-l2
  labels:
    app: decision-svc
    tier: l2-ai
    component: decision-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decision-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: decision-svc
        tier: l2-ai
        component: decision-hub
    spec:
      serviceAccountName: decision-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: decision-svc
          image: ilbuy/decision-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8012
              protocol: TCP
          envFrom:
            - configMapRef:
                name: decision-svc-config-prod
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24        # 最多等待 2 分钟启动
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 0      # startupProbe 通过后才开始
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8012
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: decision-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decision-svc
  namespace: ilbuy-l2
  labels:
    app: decision-svc
