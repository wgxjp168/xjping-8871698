apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: decision-svc-hpa
  namespace: ilbuy-l2
  labels:
    app: decision-svc
    tier: l2-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: decision-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
