apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialog-svc
  namespace: ilbuy-l2
  labels:
    app: dialog-svc
    component: l2-ai-decision
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dialog-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: dialog-svc
        component: l2-ai-decision
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Run as the non-root user created in the Dockerfile (UID 1001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: dialog-svc
          image: ilbuy/dialog-svc:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8013
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dialog-svc-config-prod
          env:
            # Sensitive values from Secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dialog-svc-secret
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dialog-svc-secret
                  key: REDIS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24        # Node.js 最多等待 2 分钟
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Writable tmp directory required by dumb-init / Node.js
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
