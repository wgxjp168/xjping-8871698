apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dialog-svc-hpa
  namespace: ilbuy-l2
  labels:
    app: dialog-svc
    tier: l2-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dialog-svc
  minReplicas: 2
  maxReplicas: 10           # 对话服务流量最大，扩容上限更高
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 20
      policies:
        - type: Pods
          value: 3          # 流量突发时允许一次扩 3 个
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
