apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-monetize-svc
  namespace: ilbuy-l7
  labels:
    app: data-monetize-svc
    layer: l7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-monetize-svc
  template:
    metadata:
      labels:
        app: data-monetize-svc
        layer: l7
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8074"
    spec:
      serviceAccountName: ilbuy-svc
      containers:
        - name: data-monetize-svc
          image: ilbuy/data-monetize-svc:latest
          ports:
            - containerPort: 8074
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l7-db-secret
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l7-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l7-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: redis.host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: redis.port
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-redis-secret
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: rabbitmq.host
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ilbuy-rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-rabbitmq-secret
                  key: password
            - name: MONETIZE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: monetize.gateway.url
            - name: L6_REPORT_URL
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: l6.report.url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilbuy-jwt-secret
                  key: secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8074
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8074
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: data-monetize-svc
  namespace: ilbuy-l7
spec:
  type: ClusterIP
  selector:
    app: data-monetize-svc
  ports:
    - name: http
      port: 8074
      targetPort: 8074
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-monetize-svc-hpa
  namespace: ilbuy-l7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-monetize-svc
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
