spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

ilbuy:
  gateway:
    url: ${MONETIZE_GATEWAY_URL}
  l6:
    report:
      url: ${L6_REPORT_URL}
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.ilbuy: INFO
    root: WARN
