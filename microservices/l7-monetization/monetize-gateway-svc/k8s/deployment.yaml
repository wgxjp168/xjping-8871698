apiVersion: apps/v1
kind: Deployment
metadata:
  name: monetize-gateway-svc
  namespace: ilbuy-l7
  labels:
    app: monetize-gateway-svc
    layer: l7
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monetize-gateway-svc
  template:
    metadata:
      labels:
        app: monetize-gateway-svc
        layer: l7
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8071"
    spec:
      serviceAccountName: ilbuy-svc
      containers:
        - name: monetize-gateway-svc
          image: ilbuy/monetize-gateway-svc:latest
          ports:
            - containerPort: 8071
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l7-db-secret
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l7-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-l7-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: redis.host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-redis-secret
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: rabbitmq.host
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ilbuy-rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ilbuy-rabbitmq-secret
                  key: password
            - name: WECHAT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ilbuy-wechat-pay-secret
                  key: app-id
            - name: WECHAT_MCH_ID
              valueFrom:
                secretKeyRef:
                  name: ilbuy-wechat-pay-secret
                  key: mch-id
            # WeChat Pay V3 — RSA private key mounted as file via secret volume
            - name: WECHAT_PRIVATE_KEY_PATH
              value: "/run/secrets/wxpay/apiclient_key.pem"
            - name: WECHAT_MERCHANT_SERIAL_NUMBER
              valueFrom:
                secretKeyRef:
                  name: ilbuy-wechat-pay-secret
                  key: merchant-serial-number
            # 32-byte API v3 key for AES-256-GCM callback decryption
            - name: WECHAT_API_V3_KEY
              valueFrom:
                secretKeyRef:
                  name: ilbuy-wechat-pay-secret
                  key: api-v3-key
            - name: ALIPAY_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ilbuy-alipay-secret
                  key: app-id
            - name: ALIPAY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ilbuy-alipay-secret
                  key: private-key
            - name: ALIPAY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ilbuy-alipay-secret
                  key: public-key
            - name: ALIPAY_RETURN_URL
              valueFrom:
                configMapKeyRef:
                  name: ilbuy-l7-config
                  key: alipay.notify.url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilbuy-jwt-secret
                  key: secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8071
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8071
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: wxpay-private-key
              mountPath: /run/secrets/wxpay
              readOnly: true
      volumes:
        - name: wxpay-private-key
          secret:
            secretName: ilbuy-wechat-pay-secret
            items:
              - key: private-key-pem
                path: apiclient_key.pem
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [monetize-gateway-svc]
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: monetize-gateway-svc
  namespace: ilbuy-l7
spec:
  type: ClusterIP
  selector:
    app: monetize-gateway-svc
  ports:
    - name: http
      port: 8071
      targetPort: 8071
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monetize-gateway-svc-hpa
  namespace: ilbuy-l7
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monetize-gateway-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
