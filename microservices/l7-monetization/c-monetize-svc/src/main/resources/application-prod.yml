spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual

logging:
  level:
    com.ilbuy: INFO
    root: WARN
