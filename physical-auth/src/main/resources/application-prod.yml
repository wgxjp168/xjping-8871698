# =========================================================
# physical-auth - PROD 环境配置（敏感值由 K8s Secret 注入）
# =========================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&requireSSL=true&verifyServerCertificate=false
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASS}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 生产环境不打印SQL

county:
  api:
    base-url: ${COUNTY_API_URL}
    token: ${COUNTY_API_TOKEN}

jwt:
  secret: ${JWT_SECRET}
  expire-seconds: 43200

logging:
  level:
    com.health.physical: info
    org.springframework.security: warn
  file:
    name: /var/log/physical/auth.log
    max-size: 100MB
    max-history: 30
