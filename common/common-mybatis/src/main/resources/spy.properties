#################################################################
# P6Spy SQL 监控配置（开发/测试环境，生产关闭）
# 开启方式：spring.datasource.dynamic.p6spy=true
#################################################################

# 驱动委托（P6Spy 拦截 JDBC 调用后转发给真实驱动）
driverlist=com.mysql.cj.jdbc.Driver

# 日志模块：使用 Slf4j（Logback/Log4j2 均支持）
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 日志级别（默认 INFO）
logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat

# 自定义 SQL 格式（含耗时、数据库名、完整 SQL）
customLogMessageFormat=%(currentTime) | elapsed:%(executionTime)ms | db:%(database) | category:%(category)\n SQL: %(sql)

# 慢 SQL 阈值（毫秒），超过则以 WARN 级别输出
executionThreshold=1000

# 过滤：不记录以下 SQL（健康检查 / 连接池 keep-alive）
filter=true
exclude=SELECT 1,select 1

# 是否输出未格式化的 SQL（true=原始SQL，false=格式化后）
outagedetection=true
outagedetectioninterval=60

# 是否记录所有 DML（true 会产生大量日志，生产禁用）
# logfile=spy.log   # 不写文件，使用 Slf4j 输出即可
