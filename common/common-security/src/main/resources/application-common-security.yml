# ====================================================
#  common-security 模块示例配置
#  复制到消费方的 application.yml 并按需修改
# ====================================================

ilbuy:
  security:
    jwt:
      # JWT 签名密钥（必填，Base64 编码，至少 256 bit / 32 字节）
      # 生成命令：openssl rand -base64 32
      secret: "aWxidXktcGxhdGZvcm0tc2VjcmV0LWtleS0zMmJ5dGVz"

      # Access Token 过期时间（秒）
      # 不同端可通过 ClientType 枚举策略覆盖
      access-token-expire: 7200       # 2 小时（WEB 默认）

      # Refresh Token 过期时间（秒）
      refresh-token-expire: 604800    # 7 天（WEB 默认）

      # JWT 签发者标识
      issuer: ilbuy-platform

      # Token 黑名单 Redis Key 前缀
      blacklist-key-prefix: "ilbuy:token:blacklist:"

spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0

# 各端 Token 有效期策略（由 ClientType 枚举固化，此处仅作说明）
# MOBILE:  Access 7d   / Refresh 30d
# WEB:     Access 2h   / Refresh 7d   （默认配置值）
# ADMIN:   Access 30min / Refresh 1d
# OPEN:    Access 1h   / Refresh 30d
# DEVICE:  Access 30d  / Refresh 1y
