apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-core
  namespace: physical-health
  labels:
    app: physical-core
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: physical-core
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: physical-core
        version: "1.0.0"
    spec:
      containers:
        - name: physical-core
          image: physical/core:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: physical-config-prod
            - secretRef:
                name: physical-secret
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9001
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9001
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/physical
      volumes:
        - name: log-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
