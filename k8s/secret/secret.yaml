# ============================================================
# K8s Secret - 敏感配置（生产环境应使用 Vault / SealedSecret）
# 使用 base64 编码：echo -n "value" | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: physical-secret
  namespace: physical-health
  labels:
    app: physical-health
type: Opaque
stringData:
  # 数据库密码（生产环境替换为实际密码，勿提交明文到Git）
  DB_USER: "physical_user"
  DB_PASS: "CHANGE_ME_IN_PRODUCTION"
  # Redis密码
  REDIS_PASS: "CHANGE_ME_IN_PRODUCTION"
  # JWT密钥（至少32字符）
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_32CHARS_MIN"
  # 县域公卫系统API Token
  COUNTY_API_TOKEN: "CHANGE_ME_IN_PRODUCTION"
