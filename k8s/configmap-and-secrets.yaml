---
# ILbuy 通用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: ilbuy-common-config
  namespace: ilbuy-prod
data:
  # 服务发现 (生产内部 DNS)
  USER_SERVICE_URL: "http://user-service:8001"
  PROCUREMENT_SERVICE_URL: "http://procurement-service:8002"
  AI_SERVICE_URL: "http://ai-matching-service:8003"
  ORDER_SERVICE_URL: "http://order-service:8004"
  DATA_SERVICE_URL: "http://data-collector-service:8005"

  # Redis
  REDIS_HOST: "redis-cluster.ilbuy-prod.svc.cluster.local"
  REDIS_PORT: "6379"

  # MySQL
  MYSQL_HOST: "mysql-primary.ilbuy-prod.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "ilbuy_prod"

  # Nacos
  NACOS_SERVER_ADDR: "nacos.ilbuy-prod.svc.cluster.local:8848"
  NACOS_NAMESPACE: "prod"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka.ilbuy-prod.svc.cluster.local:9092"

  # 应用配置
  FLASK_ENV: "production"
  LOG_LEVEL: "WARNING"
  GATEWAY_PORT: "8080"
  USER_SERVICE_PORT: "8001"
  PROCUREMENT_SERVICE_PORT: "8002"
  AI_SERVICE_PORT: "8003"
  ORDER_SERVICE_PORT: "8004"
  DATA_SERVICE_PORT: "8005"

---
# ILbuy 敏感配置 (生产环境请使用 Sealed Secrets 或 Vault)
apiVersion: v1
kind: Secret
metadata:
  name: ilbuy-secrets
  namespace: ilbuy-prod
type: Opaque
stringData:
  JWT_SECRET: "ILbuy@JWT@SecretKey@2024@Production@ChangeMe"
  REDIS_PASSWORD: "ILbuy@Redis2024@Prod"
  MYSQL_ROOT_PASSWORD: "ILbuy@MySQL@Root2024"
  MYSQL_PASSWORD: "ILbuy@DB2024@Prod"
  # LLM_API_KEY: "sk-xxxxxxxx"  # 按需填写
