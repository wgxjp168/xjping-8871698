apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-auth
  namespace: physical-health
  labels:
    app: physical-auth
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: physical-auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: physical-auth
        version: "1.0.0"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [physical-auth]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: physical-auth
          image: physical/auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9005
              name: http
          envFrom:
            - configMapRef:
                name: physical-config-prod
            - secretRef:
                name: physical-secret
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9005
            initialDelaySeconds: 90    # auth服务启动较慢（Spring Security）
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9005
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          # 挂载日志目录
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/physical
      volumes:
        - name: log-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
