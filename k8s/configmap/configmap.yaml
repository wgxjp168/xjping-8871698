---
# ============================================================
# DEV 环境 ConfigMap（非敏感配置）
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: physical-config-dev
  namespace: physical-health
  labels:
    env: dev
data:
  SPRING_PROFILES_ACTIVE: "dev"
  DB_HOST: "physical-mysql"
  DB_PORT: "3306"
  DB_NAME: "physical_health"
  REDIS_HOST: "physical-redis"
  REDIS_PORT: "6379"
  COUNTY_API_URL: "http://county-mock:8080"

---
# ============================================================
# PROD 环境 ConfigMap（非敏感配置）
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: physical-config-prod
  namespace: physical-health
  labels:
    env: prod
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "physical-mysql-headless"   # 生产使用StatefulSet headless service
  DB_PORT: "3306"
  DB_NAME: "physical_health"
  REDIS_HOST: "physical-redis-headless"
  REDIS_PORT: "6379"
  COUNTY_API_URL: "http://county-gateway.county-system.svc.cluster.local:8080"
