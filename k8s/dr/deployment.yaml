apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-dr
  namespace: physical-health
  labels:
    app: physical-dr
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: physical-dr
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: physical-dr
        version: "1.0.0"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [physical-dr]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: physical-dr
          image: physical/dr:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9011
              name: http
          envFrom:
            - configMapRef:
                name: physical-config-prod
            - secretRef:
                name: physical-secret
          env:
            - name: AUTH_SERVICE_URL
              value: "http://physical-auth:9005"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9011
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9011
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/physical
      volumes:
        - name: log-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
