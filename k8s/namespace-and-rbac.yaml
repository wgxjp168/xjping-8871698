---
# ILbuy 生产命名空间
apiVersion: v1
kind: Namespace
metadata:
  name: ilbuy-prod
  labels:
    app.kubernetes.io/managed-by: kubectl
    env: production

---
# 服务账号
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ilbuy-service-account
  namespace: ilbuy-prod

---
# RBAC - 允许读取 ConfigMap 和 Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ilbuy-pod-role
  namespace: ilbuy-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ilbuy-pod-rolebinding
  namespace: ilbuy-prod
subjects:
  - kind: ServiceAccount
    name: ilbuy-service-account
    namespace: ilbuy-prod
roleRef:
  kind: Role
  name: ilbuy-pod-role
  apiGroup: rbac.authorization.k8s.io
